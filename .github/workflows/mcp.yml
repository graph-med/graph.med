# Deploys the MCP endpoint — the Worker in mcp/ — to Cloudflare Workers
# (docs/adr/0008-the-mcp-endpoint-runs-on-cloudflare-workers.md), after each
# successful Pages deploy from main, so that the Worker and the site it reads
# change together: the Worker never goes live before the files it reads. Also
# by hand (workflow_dispatch, from main). Checks the server against the site
# just published first; deploys with `wrangler deploy` only, never
# `wrangler preview`, so no Preview URL is ever created.
name: mcp

on:
  workflow_run:
    workflows: [pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: check and deploy the MCP endpoint
    # after a Pages run that deployed main's root for a push (or by hand), not
    # after the runs that only refresh a pull request's preview
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
        with:
          # the commit Pages just published
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: check the server on the fixture and on the site just published
        run: npm run check -- --fixture --base https://graph.med/
      - name: refuse a configuration with a way around the firewall
        run: |
          grep -Eq '^workers_dev *= *false' wrangler.toml
          grep -Eq '^preview_urls *= *false' wrangler.toml
          if grep -Eq '^\[+previews' wrangler.toml; then exit 1; fi
      - name: deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
