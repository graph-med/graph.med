# The one schema for the graph.med pool — a JSON Schema (draft 2020-12), written in YAML.
#
# Authority on syntax; concepts and rules live in docs/graph-representation.md.
# Graphs are views (spec §4) and own nothing, so there is exactly one schema.
# Schema changes land BEFORE the data that uses them (spec §7); data validates
# against the schema as of its commit.
#
# Enforced by tools/validate.py (`uv run tools/validate.py`), which validates every
# file under data/ against the definition `x-layout` assigns to it, then checks the
# few rules a document schema cannot state: ids resolve across files, claim ids are
# the hash of their anchor, edges are unique, a claim's section is in its source's
# outline, `broader` has no cycles, the grouping axes hold together (spec §4.1:
# an asserted axis places each statement or concept once, a dimension's placements
# hold its values, a hierarchy's are edges the pool holds, a view's `group_by` is
# asserted for it), a view that declares a scope tree holds together (spec §4, §5:
# each member statement has one anchor, its first axis brings every anchor to the
# view's `scope_root`, `in_scope_of` has no cycle and doubles no `broader`), and
# a derived concept's rule holds together (spec §3.1, §5: a concept has one
# `defined_by` edge, to a claim of kind criterion or definition; a combination's
# parts are such claims of the same source, nest without a cycle, and its
# connective is printed in its quotes; `at_least` counts no more parts than it
# has; a relative threshold is relative to another quantity than its own),
# a claim is read in its source's grading scheme (spec §3.1: its grade and
# consensus are of its own source's `grading_scheme`, its verb one a declared
# scheme defines, a printed share lies in its class's bounds, and every word of
# a scheme lies in the quotes of its entry), and an evidence row's `outcome` is
# an endpoint (spec §3.1: a concept of facet `outcome`; whatever else the row
# names is its printed `key`).
# CI runs it on every pull request and push to main (.github/workflows/validate.yml).
#
# Keywords prefixed `x-` are this project's annotations; JSON Schema validators
# ignore them, tools/validate.py and the spec read them.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://graph.med/schema/schema.yaml
title: graph.med pool
x-version: 0.14.0

# ── layout: which definition each data file validates against ────────────────
# (data/README.md). Globs are relative to the repository root. `one_per_file`
# means the entity's id must equal <namespace>/<file stem>.
x-layout:
  data/sources/*.yaml:      {schema: {$ref: '#/$defs/source'},    one_per_file: true}
  data/concepts/*.yaml:     {schema: {$ref: '#/$defs/concept'},   one_per_file: true}
  data/statements/*.yaml:   {schema: {$ref: '#/$defs/statement'}, one_per_file: true}
  data/views/*.yaml:        {schema: {$ref: '#/$defs/view'},      one_per_file: true}
  data/axes/*.yaml:         {schema: {$ref: '#/$defs/axis'},      one_per_file: true}
  data/agents/*.yaml:       {schema: {$ref: '#/$defs/agent'},     one_per_file: true}
  data/attestations/*.yaml: {schema: {$ref: '#/$defs/attestation'}, one_per_file: true}
  data/pathways/*/*.yaml:   {schema: {$ref: '#/$defs/structural_node'}}
  data/claims/*/*.yaml:     {schema: {type: array, items: {$ref: '#/$defs/claim'}}}
  data/edges/*/*.yaml:      {schema: {type: array, items: {$ref: '#/$defs/edge'}}}

# ── namespaces ───────────────────────────────────────────────────────────────
# Namespaces mint identity; they do not own content (spec §2). Any string in the
# data that starts with a non-terminology namespace must resolve to an entity;
# terminology codes are ids by construction and are not checked for existence.
x-namespaces:
  sources:      slug-with-version          # e.g. pomgat-lv-1.0
  claims:       derived                    # claims/<source-id>/<hash8>, hash8 = sha256("<at>|<quote>")[:8]
  concepts:     minted                     # search before minting; code if possible
  statements:   minted
  pathways:     minted-within-pathway      # pathways/<pathway-id>/<entity-id>
  views:        slug
  axes:         slug                     # grouping axes (spec §4.1): proposed as data, tested, asserted, shown
  agents:       slug
  attestations: sequential
  terminologies: [icd10gm-2026, ops-2026]  # one namespace per release; codes are ids

# ── provenance requirement levels (spec §6.5), the meaning of `x-provenance` ─
#   required        must resolve to a source passage; never `modelling`
#   optional        passage or `modelling`
#   not_applicable  ours (identifiers, labels, types); no provenance recorded
# Resolution (spec §6.4): the entry under `provenance:` for the property if
# present, otherwise the entity's `source`. The constraints below encode this:
# a `required` property may only be overridden with a reference, and every
# entity that has one is anchored by a reference or overrides each such property.

# ── view filters (spec §13) and cut validations (spec §4) ───────────────────
x-view-filters:
  pathway:   # a pathway namespace plus the closure over the named edge kinds
    example: {pathway: pathways/pomgat-drains, closure: [about, supports, refines, codes_as]}
  selection: # explicit membership or property predicates; deliberately minimal
    example: {sources: [sources/pomgat-lv-1.0], modified_after: "2026-01-01"}
    # `section: {source, under}` narrows to the statements supported by claims of
    # that source whose `section` is `under` or lies beneath it (spec §4, §6.7);
    # it selects, it never adds a node or an edge
    section_example: {sources: [sources/pomgat-lv-1.0], section: {source: sources/pomgat-lv-1.0, under: "7.4"}}
x-cut-validations:
  pathway:
    - every branch edge's endpoints are members
    - every structural node's `about` targets are members
    - every member statement has at least one member supporting claim
    - no dangling slot or codes_as reference among members
  selection: []

# ── conventions ──────────────────────────────────────────────────────────────
x-conventions:
  keys: english                 # structural keys are English; they are ours, not content
  language: source-language     # ALL content values (labels, quotes, text) stay in the source
                                # language, never translated at extraction; every entity and edge
                                # carrying text declares `lang` (BCP 47). Enum values are schema
                                # vocabulary, slugified from the source language (versorgungspfad,
                                # modalitaetsbezogen). A claim's grade, verb and consensus are none:
                                # they are the words its source's `grading_scheme` declares (spec §3.1).
                                # Translations are a build-layer concern.
  quotes: verbatim-substring    # of the source's extracted text (spec §6.2); single line
  pdf_pages: physical           # #page=N counts PDF pages, not printed numbers

$defs:

  # ── value shapes ──────────────────────────────────────────────────────────
  lang:    {type: string, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$'}   # BCP 47
  sha256:  {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  url:     {type: string, pattern: '^https?://'}
  date:    {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  slug:    {type: string, pattern: '^[A-Za-z0-9._-]+$'}
  text:    {type: string, minLength: 1}
  short_text: {type: string, minLength: 1, maxLength: 60}   # a box holds two lines of ~30 characters; aim for 55 (spec §3.2)

  # entity references, by namespace (spec §2)
  source_ref:     {type: string, pattern: '^sources/[A-Za-z0-9._-]+$'}
  claim_ref:      {type: string, pattern: '^claims/[A-Za-z0-9._-]+/[0-9a-f]{8}$'}
  concept_ref:    {type: string, pattern: '^(concepts|icd10gm-2026|ops-2026)/[A-Za-z0-9._-]+$'}  # uncoded or terminology
  uncoded_concept_ref: {type: string, pattern: '^concepts/[A-Za-z0-9._-]+$'}
  terminology_ref: {type: string, pattern: '^(icd10gm-2026|ops-2026)/[A-Za-z0-9._-]+$'}
  statement_ref:  {type: string, pattern: '^statements/[A-Za-z0-9._-]+$'}
  structural_ref: {type: string, pattern: '^pathways/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'}
  agent_ref:      {type: string, pattern: '^agents/[A-Za-z0-9._-]+$'}
  view_ref:       {type: string, pattern: '^views/[A-Za-z0-9._-]+$'}
  axis_ref:       {type: string, pattern: '^axes/[A-Za-z0-9._-]+$'}
  slot_key:       {type: string, pattern: '^[a-z][a-z0-9_]*$'}   # a statement slot; English, like every structural key
  entity_ref:     {type: string, pattern: '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'}

  # what kind of thing a concept is (spec §3.2) — its nature, not its role in a statement
  # `qualifier` is a value of a statement dimension (spec §4.1): it qualifies the recommendation, not the case
  facet: {enum: [procedure, patient_state, medication, intervention, outcome, finding, qualifier]}
  # by which principles a source document is organised (spec §6.7); descriptive only
  structure_kind:
    enum: [chronologisch_perioperativ, versorgungspfad, anatomisch, entitaetsbezogen,
           modalitaetsbezogen, stadien_schweregrad, populationsbezogen, settingbezogen,
           leitsymptombezogen, berufsgruppen_prozessbezogen, querschnittskapitel]
  # one entry of a source's table of contents (spec §6.7); page is the physical PDF page
  outline_entry:
    type: object
    required: [section, title, page]
    additionalProperties: false
    properties:
      section: {type: string, minLength: 1}
      title:   {$ref: '#/$defs/text'}
      page:    {type: integer, minimum: 1}
  # one certainty rating on a claim (spec §3.1), one entry per row the source prints: the word of
  # the system that rated it, the outcome it rates where the row names an endpoint, and the row's
  # key as printed where the row names anything else (a component, a subgroup, an arm, a
  # comparator, a device, a regimen). No system, no value and no kind of row is enumerated: a
  # second guideline brings its own, and a value is never mapped onto another system's.
  # An entry states its outcome, its value, or both: an outcome the source lists without a
  # rating is recorded as the outcome alone (the row reads "nicht erfasst"), never left out;
  # an entry with neither says nothing and is refused, whatever its key
  evidence_entry:
    type: object
    required: [system]
    anyOf:
      - required: [outcome]
      - required: [value]
    additionalProperties: false
    properties:
      outcome: {$ref: '#/$defs/concept_ref'}   # the endpoint, a concept of facet `outcome` (validator); absent where the row names none
      key:     {$ref: '#/$defs/text'}          # the row's key as printed where it names anything but the endpoint — never a kind, never a concept;
                                               # beside `outcome` where the row names both; it keeps apart rows that would otherwise be one entry
      value:   {$ref: '#/$defs/text'}          # the system's own word as printed (its case too), source language, never translated; absent where the source lists the row unrated
      system:  {$ref: '#/$defs/slug'}          # grade, oxford_loe, esc_loe, … — an open string, never an enum; required with or without a value: the system whose table lists the row
  # the threshold a criterion or definition claim prints (spec §3.1): which quantity, compared how,
  # with which value — read off the page, never inferred, rounded or completed. The comparator list
  # is closed because it is mathematics, not a guideline's vocabulary; nothing else is enumerated:
  # the quantity is a concept, value, unit and time point are strings as printed, never converted.
  # A relative threshold ("less than three times the serum value") names the quantity it is
  # relative to; its value is the factor as printed. In YAML, `=` must be quoted. One per claim:
  # two values the page joins are two claims and a `combination` joining them
  threshold:
    type: object
    required: [quantity, comparator, value]
    additionalProperties: false
    properties:
      quantity:    {$ref: '#/$defs/concept_ref'}   # what is measured or scored
      comparator:  {enum: ["<", "≤", ">", "≥", "=", between]}   # `between`: `value` holds both bounds as printed
      value:       {$ref: '#/$defs/text'}          # as printed, a string ("5000", "zwei", "Dreifach"); never a number the loader may reshape
      unit:        {$ref: '#/$defs/text'}          # as printed ("U/L", "ml/Tag"); absent where the source prints none
      when:        {$ref: '#/$defs/text'}          # the time point of the measurement as printed ("am postop. Tag 1 und 3"); absent where none is printed
      relative_to: {$ref: '#/$defs/concept_ref'}   # a relative threshold: the reference quantity, another than `quantity` (validator)
  # how the parts of a rule combine (spec §3.1), read off the passage like a threshold: never a default,
  # never inferred from a word alone. The operator is the reading, from a closed set because it is logic,
  # like the comparators: all_of (UND), any_of (ODER), at_least with `n` (mindestens n von), and
  # not_stated for a passage that lists parts without saying how they combine. The connective is the
  # word or words the page prints for it ("entweder … oder … oder aber", pieces joined by " … "), each
  # piece inside a quote of `source`, so --verify-quotes checks it on the page; how it is read ("und"
  # between groups each counting on its own is any_of) is modelling, said in `rationale` in the claim's
  # `lang`. The parts are criterion or definition claims of the same source; a part that combines is
  # itself a claim with its own combination, so operators nest through claims (validator: no cycle,
  # `n` at most the number of parts). No guideline's words are enumerated
  combination:
    type: object
    required: [operator, rationale]
    additionalProperties: false
    properties:
      operator:   {enum: [all_of, any_of, at_least, not_stated]}
      n:          {type: integer, minimum: 1}         # at_least only
      of:         {type: array, minItems: 2, uniqueItems: true, items: {$ref: '#/$defs/claim_ref'}}
      connective: {$ref: '#/$defs/text'}              # as printed, source language; absent only where not stated
      source:     {$ref: '#/$defs/references'}        # where the connective is printed; every piece in one of its quotes (validator)
      rationale:  {$ref: '#/$defs/text'}              # the reading: why this operator for this connective (modelling)
    dependentRequired:   # a connective is quoted, and a quote is of a connective
      connective: [source]
      source: [connective]
    allOf:
      - if: {required: [operator], properties: {operator: {const: at_least}}}
        then: {required: [n]}
        else: {properties: {n: {not: {}}}}   # `{not: {}}` rather than `false`: the error then names the field
      - if: {required: [operator], properties: {operator: {enum: [all_of, any_of, at_least]}}}
        then: {required: [of, connective]}   # an operator the page states: its parts, and the words it states it with

  # a source's grading scheme (spec §3.1): how binding its recommendations are and how it classes the
  # agreement of its panel, in its own words, quoted from its method table. A claim's grade, verb and
  # consensus are checked against it (validator); the schema enumerates no grade, verb or class, and no
  # value is mapped between schemes. The build reads the order, the words, the negated forms and the
  # open grade from here, never from literals
  grading_scheme:
    type: object
    required: [grades]
    additionalProperties: false
    properties:
      grades:      # in the order the legend follows: the table's rows, strongest first; a grade that fixes
                   # no wording (an expert consensus whose strength its wording carries) after them
        type: array
        minItems: 1
        items: {$ref: '#/$defs/scheme_grade'}
      consensus:   # the classes the source's table sorts the agreement into, in the table's order
        type: array
        minItems: 1
        items: {$ref: '#/$defs/consensus_class'}
  # one grade of a scheme. Every word of `grade`, `verb` and `negated` lies in one of the quotes that give
  # it — `source`, or the entry's `provenance` for its negated form — as a whole word (validator); the
  # description, whose cell a table may break across lines, is read by review. Unique per scheme: the
  # grade, and the wording (validator)
  scheme_grade:
    type: object
    required: [grade, source]
    additionalProperties: false
    properties:
      grade:       {$ref: '#/$defs/text'}      # as the recommendations print it: what a claim carries as `grade`
      description: {$ref: '#/$defs/text'}      # as the table describes the grade, a word the table breaks across lines joined
      verb:        {$ref: '#/$defs/text'}      # the wording the table gives the grade, as it prints it; absent for a grade
                                               # that fixes none, whose claims' own wording carries the strength
      negated:     {$ref: '#/$defs/text'}      # that wording negated, as the source prints it — never the verb with a
                                               # negation appended (spec §3.1)
      open:        {type: boolean}             # the table makes the grade an open recommendation: a claim with its
                                               # wording weighs, neither for nor against
      source:      {$ref: '#/$defs/references'}   # where the source prints the grade: its table row, cell by cell
      provenance:  # where the negated form is printed, when not in the row; `modelling` for a form printed nowhere
        type: object
        additionalProperties: false
        properties:
          negated: {$ref: '#/$defs/provenance_value'}
      rationale:   {$ref: '#/$defs/text'}      # the reading, in the source's language, where the quotes alone do not carry it
    dependentRequired:
      negated: [verb]
      open: [verb]
    if: {required: [provenance], properties: {provenance: {required: [negated], properties: {negated: {const: modelling}}}}}
    then: {required: [rationale]}
  # one class of the source's consensus table. `class` is what a claim carries as `consensus`: the printed name
  # slugified (lower case, words joined by `_`), unique per scheme (validator). Every word of `name` and
  # `bounds` lies in one of the quotes of `source` (validator). Where the source prints shares, the bounds are
  # also read as numbers, a lower and an upper at most, and a claim's printed share must lie within its
  # class's (validator); a reading the printed bounds leave open is said in `rationale`
  consensus_class:
    type: object
    required: [class, name, source]
    additionalProperties: false
    properties:
      class:    {$ref: '#/$defs/slug'}
      name:     {$ref: '#/$defs/text'}          # as the table names it
      bounds:   {$ref: '#/$defs/text'}          # as the table prints them
      above:    {type: number}                  # the share is greater than this
      at_least: {type: number}                  # the share is this or more
      at_most:  {type: number}                  # the share is this or less
      below:    {type: number}                  # the share is less than this
      source:   {$ref: '#/$defs/references'}    # the table row, cell by cell
      rationale: {$ref: '#/$defs/text'}         # the reading of the bounds, in the source's language
    allOf:
      - not: {required: [above, at_least]}
      - not: {required: [at_most, below]}

  # ── provenance (spec §6.2–6.4) ────────────────────────────────────────────
  locator:
    type: string
    pattern: '^sources/[A-Za-z0-9._-]+(#page=[1-9][0-9]*)?$'   # physical PDF page
  reference:
    description: '"The source says this" — a locator plus a verbatim, single-line quote.'
    type: object
    required: [at, quote]
    additionalProperties: false
    properties:
      at:    {$ref: '#/$defs/locator'}
      quote: {type: string, minLength: 1, pattern: '^[^\n]+$'}
  references:
    description: A reference, or a non-empty list of them (a single one is shorthand for a list of one).
    anyOf:
      - $ref: '#/$defs/reference'
      - {type: array, minItems: 1, items: {$ref: '#/$defs/reference'}}
  provenance_value:
    description: What a `source` or a `provenance.<property>` entry may hold.
    anyOf:
      - const: modelling
      - $ref: '#/$defs/references'

  # ── node types ────────────────────────────────────────────────────────────

  source:
    type: object
    required: [id, type, title, url, content_hash, license]
    additionalProperties: false
    properties:
      id:            {$ref: '#/$defs/source_ref'}
      type:          {const: source}
      title:         {$ref: '#/$defs/text',   x-provenance: not_applicable}
      url:           {$ref: '#/$defs/url',    x-provenance: not_applicable}
      content_hash:  {$ref: '#/$defs/sha256', x-provenance: not_applicable}
      license:       {$ref: '#/$defs/text',   x-provenance: not_applicable}
      media_type:    {$ref: '#/$defs/text',   x-provenance: not_applicable}
      awmf_register: {$ref: '#/$defs/text',   x-provenance: not_applicable}
      lang:          {$ref: '#/$defs/lang',   x-provenance: not_applicable}
      outline:       # the complete table of contents, sections without a recommendation included (spec §6.7)
        type: array
        minItems: 1
        items: {$ref: '#/$defs/outline_entry'}
        x-provenance: not_applicable   # verified against the document, like content_hash
      structure:     # how the document is organised; most S3 guidelines mix several
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/structure_kind'}
        x-provenance: not_applicable
      grading_scheme:   # how binding its recommendations are and how it classes consensus (spec §3.1)
        $ref: '#/$defs/grading_scheme'
        x-provenance: optional   # carried by each entry: its quotes of the method table, `modelling` with a
                                 # rationale for a form the source prints nowhere

  claim:
    description: >
      Immutable, source-anchored extraction unit (spec §3.1). `source` is the
      anchor — always one passage, never `modelling` — and the id derives from
      it: claims/<source-id>/<hash8>, hash8 = first 8 hex of
      sha256("<at>|<quote>"), computed by tooling, checked by the validator.
    type: object
    required: [id, type, lang, label, kind, source]
    additionalProperties: false
    x-identity: derived
    properties:
      id:    {$ref: '#/$defs/claim_ref'}
      type:  {const: claim}
      lang:  {$ref: '#/$defs/lang', x-provenance: not_applicable}   # language of quote and label
      label: {$ref: '#/$defs/text', x-provenance: optional}
             # the full extracted text (a recommendation sentence), source language, never translated
      kind:
        enum: [recommendation, criterion, definition, fact, gap_notice]
        x-provenance: not_applicable
      recommendation_no: {type: string, minLength: 1, x-provenance: required}
      section:           {type: string, minLength: 1, x-provenance: required}
             # the source section the passage lies in ('7.4.1.1'); must name an entry of the
             # source's outline (validator). Document structure, on the claim only (spec §6.7)
      grade:     {$ref: '#/$defs/text', x-provenance: required}   # never from the extractor
             # as printed, one of the grades its own source's `grading_scheme` lists (validator; spec §3.1)
      verb:      {$ref: '#/$defs/text', x-provenance: required}
             # the wording the sentence uses, in the form a scheme gives it (never inflected, never negated): one
             # some declared `grading_scheme` defines — its own source's, or another's (validator)
      direction: {enum: [for, against], x-provenance: required}
      consensus: {$ref: '#/$defs/slug', x-provenance: required}
             # a class of its own source's `grading_scheme` (validator): the one the box prints, or the one the
             # source's table gives the printed share
      consensus_share: {$ref: '#/$defs/text', x-provenance: required}
             # the share of agreement as printed, where the source prints one; beside `consensus`, within its
             # class's bounds (validator)
      evidence:  # how certain the evidence is, per printed row, in the words of the system that rated it
                 # (spec §3.1); absent or [] is "not recorded". A list even where the source states one
                 # value (one entry, no `outcome`, no `key`): never a scalar, and never reduced to one value
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/evidence_entry'}
        x-provenance: required   # read off the source like grade and consensus, never inferred
      threshold:   # the threshold the passage prints (spec §3.1): criterion and definition claims only,
                   # the claims a `defined_by` edge or a combination reaches (§5). One per claim: two values
                   # the page joins are two claims, and a `combination` joins them with the page's connective
        $ref: '#/$defs/threshold'
        x-provenance: required   # the number on the page, like the grade; never from the extractor
      combination: # how the claims that are the parts of this rule combine (spec §3.1): criterion and definition
                   # claims only, and never beside a threshold — a claim is either a part or combines parts
        $ref: '#/$defs/combination'
        x-provenance: required   # each operator carries its own `source`, the connective's quotes; its reading is its `rationale`
      source: {$ref: '#/$defs/reference'}
      provenance:
        description: Per-property overrides. A `required`-provenance property may only be overridden with a passage.
        type: object
        additionalProperties: false
        properties:
          label:             {$ref: '#/$defs/provenance_value'}
          recommendation_no: {$ref: '#/$defs/references'}
          section:           {$ref: '#/$defs/references'}
          grade:             {$ref: '#/$defs/references'}
          verb:              {$ref: '#/$defs/references'}
          direction:         {$ref: '#/$defs/references'}
          consensus:         {$ref: '#/$defs/references'}
          consensus_share:   {$ref: '#/$defs/references'}
          evidence:          {$ref: '#/$defs/references'}
          threshold:         {$ref: '#/$defs/references'}
    allOf:
      - if: {anyOf: [{required: [threshold]}, {required: [combination]}]}   # a rule says for whom (the case a term covers), never how (a dose, a duration)
        then: {properties: {kind: {enum: [criterion, definition]}}}
      - if: {required: [combination]}
        then: {properties: {threshold: {not: {}}}}

  concept:
    # whether a concept is derived (established by a rule) or stated is computed from its
    # `defined_by` edges (spec §3.2, §3.3), never a field: one mechanism wherever the concept stands
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:         {$ref: '#/$defs/concept_ref'}
      type:       {const: concept}
      lang:       {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:      {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}   # for a box; reviewed content, never truncated by a build
      facet:      {$ref: '#/$defs/facet', x-provenance: not_applicable}
      definition: {$ref: '#/$defs/text', x-provenance: optional}
      source:     {$ref: '#/$defs/provenance_value'}
      provenance:
        type: object
        additionalProperties: false
        properties:
          definition: {$ref: '#/$defs/provenance_value'}

  statement:
    description: >
      Slot values are concept URLs; `condition` is a list of them, the conditions
      that hold at once. Granularity rule: the smallest unit that can be
      independently supported or contested (spec §3.2).
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    x-derived: [sources, conflict_status, effective_grade, review_state]
      # computed, never written by hand (spec §3.3); effective_grade policy is
      # an OPEN QUESTION (docs/open-questions.md → grade-derivation)
    properties:
      id:    {$ref: '#/$defs/statement_ref'}
      type:  {const: statement}
      lang:  {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label: {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
             # the proposition compressed for a box; must still tell siblings apart (spec §3.2)
      slots:
        type: object
        propertyNames: {$ref: '#/$defs/slot_key'}
        properties:     # the slots every statement has; a hierarchy axis folds one of them (spec §4.1)
          population: {$ref: '#/$defs/concept_ref'}
          action:     {$ref: '#/$defs/concept_ref'}
          condition:    # always a list, one entry or more: several entries hold at once (a conjunction);
                        # an "or" of the source is one concept, never two entries (spec §3.2)
            type: array
            minItems: 1
            uniqueItems: true
            items: {$ref: '#/$defs/concept_ref'}
          outcome:    {$ref: '#/$defs/concept_ref'}
        additionalProperties: false
          # no further slot: the value a dimension axis gives a statement is that axis's
          # placement, never a slot of the statement (spec §4.1)
      source: {$ref: '#/$defs/provenance_value'}

  # structural node types (pathways/ namespace; all pure modelling)
  structural_node:
    oneOf:
      - $ref: '#/$defs/decision'
      - $ref: '#/$defs/outcome'
      - $ref: '#/$defs/gap'
  decision:
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:       {$ref: '#/$defs/structural_ref'}
      type:     {const: decision}
      lang:     {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:    {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      criteria: {type: object,          x-provenance: optional}
      source:   {$ref: '#/$defs/provenance_value'}
      provenance:
        type: object
        additionalProperties: false
        properties:
          criteria: {$ref: '#/$defs/provenance_value'}
  outcome:
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:     {$ref: '#/$defs/structural_ref'}
      type:   {const: outcome}
      lang:   {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:  {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      source: {$ref: '#/$defs/provenance_value'}
  gap:
    description: An explicit "no recommendation possible" in the source (spec §11.7); its label is quoted from the source.
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:     {$ref: '#/$defs/structural_ref'}
      type:   {const: gap}
      lang:   {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:  {$ref: '#/$defs/text', x-provenance: required}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      source: {$ref: '#/$defs/references'}   # required provenance: never modelling

  agent:
    type: object
    required: [id, type, label]
    additionalProperties: false
    properties:
      id:                   {$ref: '#/$defs/agent_ref'}
      type:                 {const: agent}
      label:                {$ref: '#/$defs/text', x-provenance: not_applicable}
      identity_claims:      {type: array,          x-provenance: not_applicable}
      verification_methods: {type: array,          x-provenance: not_applicable}

  attestation:
    type: object
    required: [id, type, subject, subject_hash, scope, claim, by, date, proof]
    additionalProperties: false
    properties:
      id:           {type: string, pattern: '^attestations/[A-Za-z0-9._-]+$'}
      type:         {const: attestation}
      subject:      {$ref: '#/$defs/entity_ref'}
      subject_hash: {$ref: '#/$defs/sha256'}
      scope:        {enum: [content, with_evidence]}
      claim:        {enum: [expert_reviewed, validated, disputed]}
      by:           {$ref: '#/$defs/agent_ref'}
      date:         {$ref: '#/$defs/date'}
      source_hash:  {$ref: '#/$defs/sha256'}
      proof:        {type: object}
    if:   {properties: {claim: {const: validated}}}
    then: {required: [source_hash]}          # spec §8

  view:
    type: object
    required: [id, type, view_kind, filter]
    additionalProperties: false
    properties:
      id:        {type: string, pattern: '^views/[A-Za-z0-9._-]+$'}
      type:      {const: view}
      view_kind: {enum: [pathway, selection]}
      filter:    {type: object}               # forms: see x-view-filters
      cuts:
        type: array
        items:
          type: object
          required: [cut, as_of, members_hash, validated]
          additionalProperties: false
          properties:
            cut:          {type: integer, minimum: 1}
            as_of:        {type: string, minLength: 7}     # a commit
            members_hash: {$ref: '#/$defs/sha256'}
            validated:    {type: boolean}
      group_by:   # the asserted axes the view offers, in the order its switch lists them (spec §4.1);
                  # beside `filter`, not a filter form: it selects nothing. Each must be asserted for
                  # this view in the axis's `views` (validator). The first, when a hierarchy over the
                  # anchor slot, is the view's tree of patient groups — and must be, in a view that
                  # declares `scope_root` (validator); the chapters are the one grouping built in
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/axis_ref'}
      anchor_slot:  # the statement slot that holds each member statement's anchor — the guideline's
                    # primary index (spec §4, §4.1 question 1): one of the statement's own slots (validator)
        $ref: '#/$defs/slot_key'
      scope_root:   # the concept at the top of the view's scope tree — the guideline's own scope,
                    # declared, never inferred (spec §4, §5 `in_scope_of`); every anchor reaches it (validator)
        $ref: '#/$defs/uncoded_concept_ref'
    dependentRequired:   # a scope tree is declared whole: the slot it is read over and its root
      anchor_slot: [scope_root]
      scope_root:  [anchor_slot]

  # ── grouping axes (spec §4.1) ─────────────────────────────────────────────
  # By what a view groups the answers to a question is an axis, and no axis is built in:
  # a person proposes one as this entity, tools/axes.py tests it and prints a report
  # (it never writes), a linking pass asserts it — the `views` entry set to `asserted`,
  # the placements kept — and a view offers it in `group_by`. An axis is an overlay: its
  # placements are the grouping, and the pool it lies over holds only the facts they
  # choose from — the statements' own slots, the `broader` and `in_scope_of` edges.
  # This definition fixes the mechanism only; the vocabulary of axes is the set of
  # these entities. The validator adds what is cross-file: a dimension's `slot` is
  # none of the statement's own slots and is declared by exactly one axis; a
  # hierarchy's `slot` is one of them; `values` are concepts of facet `qualifier`;
  # placements resolve, and a dimension's are among its `values`; once the axis is
  # asserted for any view, each is a single place (unless a hierarchy says
  # `several`), and a hierarchy's is an edge the pool holds.
  axis:
    type: object
    required: [id, type, lang, label, carrier, slot, rule, proposed_by, views]
    additionalProperties: false
    properties:
      id:          {$ref: '#/$defs/axis_ref'}
      type:        {const: axis}
      lang:        {$ref: '#/$defs/lang',       x-provenance: not_applicable}   # of label and rule
      label:       {$ref: '#/$defs/text',       x-provenance: not_applicable}   # what the site's switch shows
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      carrier:     {enum: [dimension, hierarchy], x-provenance: not_applicable}
      slot:        {$ref: '#/$defs/slot_key',   x-provenance: not_applicable}
                   # dimension: the key its values are shown and asked under, never one of the statement's
                   # own slots; hierarchy: the statement slot whose concepts it folds
      values:      # dimension only: what a statement may have on the axis, in the order the tree shows them
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/uncoded_concept_ref'}
        x-provenance: not_applicable
      several:     {type: boolean, default: false, x-provenance: not_applicable}
                   # hierarchy only: whether a concept may have more than one parent on this axis
      question:    {$ref: '#/$defs/text',       x-provenance: not_applicable}
                   # dimension only, optional: the question the tree asks for it, whole, in `lang` —
                   # where the site's generic form would be wrong in that language (spec §4.1)
      rule:        {$ref: '#/$defs/text',       x-provenance: not_applicable}
                   # for people, in the source language: what earns which value or which family
      proposed_by: {enum: [physician, maintainer, agent], x-provenance: not_applicable}   # a role, never a name
      views:       # one entry per view the axis is proposed for; a status is per view
        type: array
        minItems: 1
        items:
          type: object
          required: [view, status, since]
          additionalProperties: false
          properties:
            view:   {$ref: '#/$defs/view_ref'}
            status: {enum: [proposed, asserted, withdrawn]}
            since:  {$ref: '#/$defs/date'}
        x-provenance: not_applicable
      placements:  # the rule applied: dimension {statement: value}, hierarchy {concept: parent}; while
                   # proposed a list where the rule yields more than one place (the report's disjointness).
                   # Kept once asserted: they are the grouping (spec §4.1)
        type: object
        x-provenance: not_applicable
    allOf:
      - if: {required: [carrier], properties: {carrier: {const: dimension}}}
        then:
          required: [values]
          properties:
            several: {not: {}}   # a hierarchy's field (`{not: {}}` rather than `false`: the error then names the field)
            placements:
              propertyNames: {$ref: '#/$defs/statement_ref'}
              additionalProperties: {$ref: '#/$defs/place'}
      - if: {required: [carrier], properties: {carrier: {const: hierarchy}}}
        then:
          properties:
            values: {not: {}}    # a dimension's field
            question: {not: {}}  # a hierarchy never changes which question is asked
            placements:
              propertyNames: {$ref: '#/$defs/uncoded_concept_ref'}
              additionalProperties: {$ref: '#/$defs/place'}
  place:
    description: >
      Where a placement puts something — one concept, or several where the rule yields more than one;
      written `{place, rationale}` where the rule alone does not decide it, the rationale in the axis's
      `lang` (spec §4.1).
    anyOf:
      - $ref: '#/$defs/places'
      - type: object
        required: [place, rationale]
        additionalProperties: false
        properties:
          place:     {$ref: '#/$defs/places'}
          rationale: {$ref: '#/$defs/text'}
  places:
    anyOf:
      - $ref: '#/$defs/uncoded_concept_ref'
      - {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/uncoded_concept_ref'}}

  # ── edges ─────────────────────────────────────────────────────────────────
  # An edge is the tuple [from, kind, to, {properties}] (spec §5). Its id derives
  # from (from, kind, to) plus `discriminator` when parallel edges of one kind
  # exist; the validator checks uniqueness. Every edge carries `source`;
  # `modelling` where no document states the relation. An edge with textual
  # properties (rationale, guard) declares `lang` for them.
  edge_props:
    type: object
    required: [source]
    additionalProperties: false
    properties:
      source:        {$ref: '#/$defs/provenance_value'}
      lang:          {$ref: '#/$defs/lang'}
      discriminator: {$ref: '#/$defs/slug'}
      rationale:     {$ref: '#/$defs/text'}
      as_of:         {$ref: '#/$defs/date'}
      guard:         {}
      condition:     {$ref: '#/$defs/concept_ref'}   # in_scope_of only: under which circumstance the membership holds; absent = unconditional (spec §5)
    dependentRequired:
      rationale: [lang]
  modelling_edge_props:
    description: 'Cross-source semantics are our assertions (spec §5) — always modelling, with rationale and date.'
    allOf:
      - $ref: '#/$defs/edge_props'
      - required: [source, rationale, as_of, lang]
        properties: {source: {const: modelling}}

  edge:
    type: array
    minItems: 4
    maxItems: 4
    prefixItems:
      - $ref: '#/$defs/entity_ref'
      - enum: [supports, contests, refines, supplements, limits, codes_as, broader, in_scope_of,
               defined_by, sequence, branch, about, specializes, complements, conflicts]
      - $ref: '#/$defs/entity_ref'
      - $ref: '#/$defs/edge_props'
    allOf:
      # evidence — the only edges that carry evidential weight
      - if: {prefixItems: [true, {enum: [supports, contests]}]}
        then: {prefixItems: [{$ref: '#/$defs/claim_ref'}, true, {$ref: '#/$defs/statement_ref'}]}
      # body-text relations — never inherit a recommendation's grade
      - if: {prefixItems: [true, {enum: [refines, supplements, limits]}]}
        then: {prefixItems: [{$ref: '#/$defs/claim_ref'}, true, {$ref: '#/$defs/claim_ref'}]}
      # coding — a code is a node, coding is an edge
      - if: {prefixItems: [true, {const: codes_as}]}
        then: {prefixItems: [{$ref: '#/$defs/concept_ref'}, true, {$ref: '#/$defs/terminology_ref'}]}
      # subsumption — "is a special case of", between uncoded concepts, modelling with a
      # rationale; carries no evidence and nothing is inherited along it (spec §5); acyclic (validator)
      - if: {prefixItems: [true, {const: broader}]}
        then:
          prefixItems: [{$ref: '#/$defs/uncoded_concept_ref'}, true, {$ref: '#/$defs/uncoded_concept_ref'},
                        {$ref: '#/$defs/modelling_edge_props'}]
      # scope — "counts, within the scope of the view whose `scope_root` it leads to, as a case of":
      # a membership one guideline stipulates for its own scope, which `broader` (true whatever
      # guideline you read) cannot hold (spec §5). Between uncoded concepts, modelling with a
      # rationale; an optional `condition` says under which circumstance, absent = unconditional.
      # The validator checks that it forms no cycle, alone or with `broader`, and doubles no `broader`
      - if: {prefixItems: [true, {const: in_scope_of}]}
        then:
          prefixItems: [{$ref: '#/$defs/uncoded_concept_ref'}, true, {$ref: '#/$defs/uncoded_concept_ref'},
                        {$ref: '#/$defs/modelling_edge_props'}]
      - if: {prefixItems: [true, true, true, {required: [condition]}]}
        then: {prefixItems: [true, {const: in_scope_of}]}
      # definition — "is established by the rule this claim gives": a concept the clinician cannot
      # observe but establishes by a threshold, a score or a definition (spec §3.2, §5). Concept →
      # claim, modelling with a rationale. One edge per concept: several rules reach it through the
      # combination the page prints, on the claim the edge leads to, never through a second edge. The
      # validator checks that the claim is of kind criterion or definition and that no concept has two
      - if: {prefixItems: [true, {const: defined_by}]}
        then:
          prefixItems: [{$ref: '#/$defs/concept_ref'}, true, {$ref: '#/$defs/claim_ref'},
                        {$ref: '#/$defs/modelling_edge_props'}]
      # structure — among structural nodes, and from them to statements
      - if: {prefixItems: [true, {const: sequence}]}
        then: {prefixItems: [{$ref: '#/$defs/structural_ref'}, true, {$ref: '#/$defs/structural_ref'}]}
      - if: {prefixItems: [true, {const: branch}]}
        then:
          prefixItems: [{$ref: '#/$defs/structural_ref'}, true, {$ref: '#/$defs/structural_ref'},
                        {required: [source, guard]}]
      - if: {prefixItems: [true, {const: about}]}
        then: {prefixItems: [{$ref: '#/$defs/structural_ref'}, true, {$ref: '#/$defs/statement_ref'}]}
      # cross-source semantics — statement → statement, modelling-only
      - if: {prefixItems: [true, {enum: [specializes, complements, conflicts]}]}
        then:
          prefixItems: [{$ref: '#/$defs/statement_ref'}, true, {$ref: '#/$defs/statement_ref'},
                        {$ref: '#/$defs/modelling_edge_props'}]
