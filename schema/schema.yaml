# The one schema for the graph.med pool — a JSON Schema (draft 2020-12), written in YAML.
#
# Authority on syntax; concepts and rules live in docs/graph-representation.md.
# Graphs are views (spec §4) and own nothing, so there is exactly one schema.
# Schema changes land BEFORE the data that uses them (spec §7); data validates
# against the schema as of its commit.
#
# Enforced by tools/validate.py (`uv run tools/validate.py`), which validates every
# file under data/ against the definition `x-layout` assigns to it, then checks the
# few rules a document schema cannot state: ids resolve across files, claim ids are
# the hash of their anchor, edges are unique, a claim's section is in its source's
# outline, `broader` has no cycles, and the grouping axes hold together (spec §4.1:
# a statement's extra slot is declared by one dimension axis and holds one of its
# values, `axis` on an edge names a hierarchy axis with no cycle within it, a view's
# `group_by` is asserted for it). CI runs it on every pull request and push to
# main (.github/workflows/validate.yml).
#
# Keywords prefixed `x-` are this project's annotations; JSON Schema validators
# ignore them, tools/validate.py and the spec read them.

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://graph.med/schema/schema.yaml
title: graph.med pool
x-version: 0.7.0

# ── layout: which definition each data file validates against ────────────────
# (data/README.md). Globs are relative to the repository root. `one_per_file`
# means the entity's id must equal <namespace>/<file stem>.
x-layout:
  data/sources/*.yaml:      {schema: {$ref: '#/$defs/source'},    one_per_file: true}
  data/concepts/*.yaml:     {schema: {$ref: '#/$defs/concept'},   one_per_file: true}
  data/statements/*.yaml:   {schema: {$ref: '#/$defs/statement'}, one_per_file: true}
  data/views/*.yaml:        {schema: {$ref: '#/$defs/view'},      one_per_file: true}
  data/axes/*.yaml:         {schema: {$ref: '#/$defs/axis'},      one_per_file: true}
  data/agents/*.yaml:       {schema: {$ref: '#/$defs/agent'},     one_per_file: true}
  data/attestations/*.yaml: {schema: {$ref: '#/$defs/attestation'}, one_per_file: true}
  data/pathways/*/*.yaml:   {schema: {$ref: '#/$defs/structural_node'}}
  data/claims/*/*.yaml:     {schema: {type: array, items: {$ref: '#/$defs/claim'}}}
  data/edges/*/*.yaml:      {schema: {type: array, items: {$ref: '#/$defs/edge'}}}

# ── namespaces ───────────────────────────────────────────────────────────────
# Namespaces mint identity; they do not own content (spec §2). Any string in the
# data that starts with a non-terminology namespace must resolve to an entity;
# terminology codes are ids by construction and are not checked for existence.
x-namespaces:
  sources:      slug-with-version          # e.g. pomgat-lv-1.0
  claims:       derived                    # claims/<source-id>/<hash8>, hash8 = sha256("<at>|<quote>")[:8]
  concepts:     minted                     # search before minting; code if possible
  statements:   minted
  pathways:     minted-within-pathway      # pathways/<pathway-id>/<entity-id>
  views:        slug
  axes:         slug                     # grouping axes (spec §4.1): proposed as data, tested, asserted, shown
  agents:       slug
  attestations: sequential
  terminologies: [icd10gm-2026, ops-2026]  # one namespace per release; codes are ids

# ── provenance requirement levels (spec §6.5), the meaning of `x-provenance` ─
#   required        must resolve to a source passage; never `modelling`
#   optional        passage or `modelling`
#   not_applicable  ours (identifiers, labels, types); no provenance recorded
# Resolution (spec §6.4): the entry under `provenance:` for the property if
# present, otherwise the entity's `source`. The constraints below encode this:
# a `required` property may only be overridden with a reference, and every
# entity that has one is anchored by a reference or overrides each such property.

# ── view filters (spec §13) and cut validations (spec §4) ───────────────────
x-view-filters:
  pathway:   # a pathway namespace plus the closure over the named edge kinds
    example: {pathway: pathways/pomgat-drains, closure: [about, supports, refines, codes_as]}
  selection: # explicit membership or property predicates; deliberately minimal
    example: {sources: [sources/pomgat-lv-1.0], modified_after: "2026-01-01"}
    # `section: {source, under}` narrows to the statements supported by claims of
    # that source whose `section` is `under` or lies beneath it (spec §4, §6.7);
    # it selects, it never adds a node or an edge
    section_example: {sources: [sources/pomgat-lv-1.0], section: {source: sources/pomgat-lv-1.0, under: "7.4"}}
x-cut-validations:
  pathway:
    - every branch edge's endpoints are members
    - every structural node's `about` targets are members
    - every member statement has at least one member supporting claim
    - no dangling slot or codes_as reference among members
  selection: []

# ── conventions ──────────────────────────────────────────────────────────────
x-conventions:
  keys: english                 # structural keys are English; they are ours, not content
  language: source-language     # ALL content values (labels, quotes, text) stay in the source
                                # language, never translated at extraction; every entity and edge
                                # carrying text declares `lang` (BCP 47). Enum values are schema
                                # vocabulary, slugified from the source language (soll/sollte/kann,
                                # konsens/starker_konsens). Translations are a build-layer concern.
  quotes: verbatim-substring    # of the source's extracted text (spec §6.2); single line
  pdf_pages: physical           # #page=N counts PDF pages, not printed numbers

$defs:

  # ── value shapes ──────────────────────────────────────────────────────────
  lang:    {type: string, pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$'}   # BCP 47
  sha256:  {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  url:     {type: string, pattern: '^https?://'}
  date:    {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
  slug:    {type: string, pattern: '^[A-Za-z0-9._-]+$'}
  text:    {type: string, minLength: 1}
  short_text: {type: string, minLength: 1, maxLength: 60}   # a box holds two lines of ~30 characters; aim for 55 (spec §3.2)

  # entity references, by namespace (spec §2)
  source_ref:     {type: string, pattern: '^sources/[A-Za-z0-9._-]+$'}
  claim_ref:      {type: string, pattern: '^claims/[A-Za-z0-9._-]+/[0-9a-f]{8}$'}
  concept_ref:    {type: string, pattern: '^(concepts|icd10gm-2026|ops-2026)/[A-Za-z0-9._-]+$'}  # uncoded or terminology
  uncoded_concept_ref: {type: string, pattern: '^concepts/[A-Za-z0-9._-]+$'}
  terminology_ref: {type: string, pattern: '^(icd10gm-2026|ops-2026)/[A-Za-z0-9._-]+$'}
  statement_ref:  {type: string, pattern: '^statements/[A-Za-z0-9._-]+$'}
  structural_ref: {type: string, pattern: '^pathways/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'}
  agent_ref:      {type: string, pattern: '^agents/[A-Za-z0-9._-]+$'}
  view_ref:       {type: string, pattern: '^views/[A-Za-z0-9._-]+$'}
  axis_ref:       {type: string, pattern: '^axes/[A-Za-z0-9._-]+$'}
  slot_key:       {type: string, pattern: '^[a-z][a-z0-9_]*$'}   # a statement slot; English, like every structural key
  entity_ref:     {type: string, pattern: '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'}

  # what kind of thing a concept is (spec §3.2) — its nature, not its role in a statement
  # `qualifier` is a value of a statement dimension (spec §4.1): it qualifies the recommendation, not the case
  facet: {enum: [procedure, patient_state, medication, intervention, outcome, finding, qualifier]}
  # by which principles a source document is organised (spec §6.7); descriptive only
  structure_kind:
    enum: [chronologisch_perioperativ, versorgungspfad, anatomisch, entitaetsbezogen,
           modalitaetsbezogen, stadien_schweregrad, populationsbezogen, settingbezogen,
           leitsymptombezogen, berufsgruppen_prozessbezogen, querschnittskapitel]
  # one entry of a source's table of contents (spec §6.7); page is the physical PDF page
  outline_entry:
    type: object
    required: [section, title, page]
    additionalProperties: false
    properties:
      section: {type: string, minLength: 1}
      title:   {$ref: '#/$defs/text'}
      page:    {type: integer, minimum: 1}
  # one certainty rating on a claim (spec §3.1): the word of the system that rated it, and the
  # outcome it rates where the source rates per outcome. No system and no value is enumerated:
  # a second guideline brings its own, and a value is never mapped onto another system's.
  # An entry states its outcome, its value, or both: an outcome the source lists without a
  # rating is recorded as the outcome alone (the row reads "nicht erfasst"), never left out;
  # an entry with neither says nothing and is refused
  evidence_entry:
    type: object
    required: [system]
    anyOf:
      - required: [outcome]
      - required: [value]
    additionalProperties: false
    properties:
      outcome: {$ref: '#/$defs/concept_ref'}   # absent where the source rates the whole recommendation
      value:   {$ref: '#/$defs/text'}          # the system's own word, source language, never translated; absent where the source lists the outcome unrated
      system:  {$ref: '#/$defs/slug'}          # grade, oxford_loe, esc_loe, … — an open string, never an enum; required with or without a value: the system whose table lists the outcome

  # ── provenance (spec §6.2–6.4) ────────────────────────────────────────────
  locator:
    type: string
    pattern: '^sources/[A-Za-z0-9._-]+(#page=[1-9][0-9]*)?$'   # physical PDF page
  reference:
    description: '"The source says this" — a locator plus a verbatim, single-line quote.'
    type: object
    required: [at, quote]
    additionalProperties: false
    properties:
      at:    {$ref: '#/$defs/locator'}
      quote: {type: string, minLength: 1, pattern: '^[^\n]+$'}
  references:
    description: A reference, or a non-empty list of them (a single one is shorthand for a list of one).
    anyOf:
      - $ref: '#/$defs/reference'
      - {type: array, minItems: 1, items: {$ref: '#/$defs/reference'}}
  provenance_value:
    description: What a `source` or a `provenance.<property>` entry may hold.
    anyOf:
      - const: modelling
      - $ref: '#/$defs/references'

  # ── node types ────────────────────────────────────────────────────────────

  source:
    type: object
    required: [id, type, title, url, content_hash, license]
    additionalProperties: false
    properties:
      id:            {$ref: '#/$defs/source_ref'}
      type:          {const: source}
      title:         {$ref: '#/$defs/text',   x-provenance: not_applicable}
      url:           {$ref: '#/$defs/url',    x-provenance: not_applicable}
      content_hash:  {$ref: '#/$defs/sha256', x-provenance: not_applicable}
      license:       {$ref: '#/$defs/text',   x-provenance: not_applicable}
      media_type:    {$ref: '#/$defs/text',   x-provenance: not_applicable}
      awmf_register: {$ref: '#/$defs/text',   x-provenance: not_applicable}
      lang:          {$ref: '#/$defs/lang',   x-provenance: not_applicable}
      outline:       # the complete table of contents, sections without a recommendation included (spec §6.7)
        type: array
        minItems: 1
        items: {$ref: '#/$defs/outline_entry'}
        x-provenance: not_applicable   # verified against the document, like content_hash
      structure:     # how the document is organised; most S3 guidelines mix several
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/structure_kind'}
        x-provenance: not_applicable

  claim:
    description: >
      Immutable, source-anchored extraction unit (spec §3.1). `source` is the
      anchor — always one passage, never `modelling` — and the id derives from
      it: claims/<source-id>/<hash8>, hash8 = first 8 hex of
      sha256("<at>|<quote>"), computed by tooling, checked by the validator.
    type: object
    required: [id, type, lang, label, kind, source]
    additionalProperties: false
    x-identity: derived
    properties:
      id:    {$ref: '#/$defs/claim_ref'}
      type:  {const: claim}
      lang:  {$ref: '#/$defs/lang', x-provenance: not_applicable}   # language of quote and label
      label: {$ref: '#/$defs/text', x-provenance: optional}
             # the full extracted text (a recommendation sentence), source language, never translated
      kind:
        enum: [recommendation, criterion, definition, fact, gap_notice]
        x-provenance: not_applicable
      recommendation_no: {type: string, minLength: 1, x-provenance: required}
      section:           {type: string, minLength: 1, x-provenance: required}
             # the source section the passage lies in ('7.4.1.1'); must name an entry of the
             # source's outline (validator). Document structure, on the claim only (spec §6.7)
      grade:     {enum: ["A", "B", "0", "EK"],   x-provenance: required}   # never from the extractor
      verb:      {enum: [soll, sollte, kann],     x-provenance: required}
      direction: {enum: [for, against],           x-provenance: required}
      consensus: {enum: [konsens, starker_konsens, mehrheitliche_zustimmung], x-provenance: required}
      evidence:  # how certain the evidence is, per outcome, in the words of the system that rated it
                 # (spec §3.1); absent or [] is "not recorded". A list even where the source states one
                 # value (one entry, no `outcome`): never a scalar, and never reduced to one value
        type: array
        uniqueItems: true
        items: {$ref: '#/$defs/evidence_entry'}
        x-provenance: required   # read off the source like grade and consensus, never inferred
      source: {$ref: '#/$defs/reference'}
      provenance:
        description: Per-property overrides. A `required`-provenance property may only be overridden with a passage.
        type: object
        additionalProperties: false
        properties:
          label:             {$ref: '#/$defs/provenance_value'}
          recommendation_no: {$ref: '#/$defs/references'}
          section:           {$ref: '#/$defs/references'}
          grade:             {$ref: '#/$defs/references'}
          verb:              {$ref: '#/$defs/references'}
          direction:         {$ref: '#/$defs/references'}
          consensus:         {$ref: '#/$defs/references'}
          evidence:          {$ref: '#/$defs/references'}

  concept:
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:         {$ref: '#/$defs/concept_ref'}
      type:       {const: concept}
      lang:       {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:      {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}   # for a box; reviewed content, never truncated by a build
      facet:      {$ref: '#/$defs/facet', x-provenance: not_applicable}
      definition: {$ref: '#/$defs/text', x-provenance: optional}
      source:     {$ref: '#/$defs/provenance_value'}
      provenance:
        type: object
        additionalProperties: false
        properties:
          definition: {$ref: '#/$defs/provenance_value'}

  statement:
    description: >
      Slot values are concept URLs. Granularity rule: the smallest unit that can
      be independently supported or contested (spec §3.2).
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    x-derived: [sources, conflict_status, effective_grade, review_state]
      # computed, never written by hand (spec §3.3); effective_grade policy is
      # an OPEN QUESTION (docs/open-questions.md → grade-derivation)
    properties:
      id:    {$ref: '#/$defs/statement_ref'}
      type:  {const: statement}
      lang:  {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label: {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
             # the proposition compressed for a box; must still tell siblings apart (spec §3.2)
      slots:
        type: object
        propertyNames: {$ref: '#/$defs/slot_key'}
        properties:     # the slots every statement has; a hierarchy axis folds one of them (spec §4.1)
          population: {$ref: '#/$defs/concept_ref'}
          action:     {$ref: '#/$defs/concept_ref'}
          condition:  {$ref: '#/$defs/concept_ref'}
          outcome:    {$ref: '#/$defs/concept_ref'}
        additionalProperties: {$ref: '#/$defs/uncoded_concept_ref'}
          # a further slot exists only where a dimension axis declares it, and holds one of that
          # axis's `values` (spec §4.1; validator) — the schema names no such slot
      source: {$ref: '#/$defs/provenance_value'}

  # structural node types (pathways/ namespace; all pure modelling)
  structural_node:
    oneOf:
      - $ref: '#/$defs/decision'
      - $ref: '#/$defs/outcome'
      - $ref: '#/$defs/gap'
  decision:
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:       {$ref: '#/$defs/structural_ref'}
      type:     {const: decision}
      lang:     {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:    {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      criteria: {type: object,          x-provenance: optional}
      source:   {$ref: '#/$defs/provenance_value'}
      provenance:
        type: object
        additionalProperties: false
        properties:
          criteria: {$ref: '#/$defs/provenance_value'}
  outcome:
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:     {$ref: '#/$defs/structural_ref'}
      type:   {const: outcome}
      lang:   {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:  {$ref: '#/$defs/text', x-provenance: not_applicable}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      source: {$ref: '#/$defs/provenance_value'}
  gap:
    description: An explicit "no recommendation possible" in the source (spec §11.7); its label is quoted from the source.
    type: object
    required: [id, type, lang, label, source]
    additionalProperties: false
    properties:
      id:     {$ref: '#/$defs/structural_ref'}
      type:   {const: gap}
      lang:   {$ref: '#/$defs/lang', x-provenance: not_applicable}
      label:  {$ref: '#/$defs/text', x-provenance: required}
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      source: {$ref: '#/$defs/references'}   # required provenance: never modelling

  agent:
    type: object
    required: [id, type, label]
    additionalProperties: false
    properties:
      id:                   {$ref: '#/$defs/agent_ref'}
      type:                 {const: agent}
      label:                {$ref: '#/$defs/text', x-provenance: not_applicable}
      identity_claims:      {type: array,          x-provenance: not_applicable}
      verification_methods: {type: array,          x-provenance: not_applicable}

  attestation:
    type: object
    required: [id, type, subject, subject_hash, scope, claim, by, date, proof]
    additionalProperties: false
    properties:
      id:           {type: string, pattern: '^attestations/[A-Za-z0-9._-]+$'}
      type:         {const: attestation}
      subject:      {$ref: '#/$defs/entity_ref'}
      subject_hash: {$ref: '#/$defs/sha256'}
      scope:        {enum: [content, with_evidence]}
      claim:        {enum: [expert_reviewed, validated, disputed]}
      by:           {$ref: '#/$defs/agent_ref'}
      date:         {$ref: '#/$defs/date'}
      source_hash:  {$ref: '#/$defs/sha256'}
      proof:        {type: object}
    if:   {properties: {claim: {const: validated}}}
    then: {required: [source_hash]}          # spec §8

  view:
    type: object
    required: [id, type, view_kind, filter]
    additionalProperties: false
    properties:
      id:        {type: string, pattern: '^views/[A-Za-z0-9._-]+$'}
      type:      {const: view}
      view_kind: {enum: [pathway, selection]}
      filter:    {type: object}               # forms: see x-view-filters
      cuts:
        type: array
        items:
          type: object
          required: [cut, as_of, members_hash, validated]
          additionalProperties: false
          properties:
            cut:          {type: integer, minimum: 1}
            as_of:        {type: string, minLength: 7}     # a commit
            members_hash: {$ref: '#/$defs/sha256'}
            validated:    {type: boolean}
      group_by:   # the asserted axes the view offers, in the order its switch lists them (spec §4.1);
                  # beside `filter`, not a filter form: it selects nothing. Each must be asserted for
                  # this view in the axis's `views` (validator); the plain hierarchy needs no entry
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/axis_ref'}

  # ── grouping axes (spec §4.1) ─────────────────────────────────────────────
  # By what a view groups the answers to a question is an axis, and no axis is built in:
  # a person proposes one as this entity, tools/axes.py tests it and prints a report
  # (it never writes), a linking pass asserts it with provenance — `axis` on `broader`
  # edges for a hierarchy, a slot value on each statement for a dimension — and a view
  # offers it in `group_by`. This definition fixes the mechanism only; the vocabulary of
  # axes is the set of these entities. The validator adds what is cross-file: a
  # dimension's `slot` is none of the statement's own slots and is declared by exactly
  # one axis; a hierarchy's `slot` is one of them; `values` are concepts of facet
  # `qualifier`; placements resolve, and a dimension's are among its `values`.
  axis:
    type: object
    required: [id, type, lang, label, carrier, slot, rule, proposed_by, views]
    additionalProperties: false
    properties:
      id:          {$ref: '#/$defs/axis_ref'}
      type:        {const: axis}
      lang:        {$ref: '#/$defs/lang',       x-provenance: not_applicable}   # of label and rule
      label:       {$ref: '#/$defs/text',       x-provenance: not_applicable}   # what the site's switch shows
      short_label: {$ref: '#/$defs/short_text', x-provenance: not_applicable}
      carrier:     {enum: [dimension, hierarchy], x-provenance: not_applicable}
      slot:        {$ref: '#/$defs/slot_key',   x-provenance: not_applicable}
                   # dimension: the slot the axis adds to statements; hierarchy: the statement slot whose concepts it folds
      values:      # dimension only: what the slot may hold, in the order the tree shows them
        type: array
        minItems: 1
        uniqueItems: true
        items: {$ref: '#/$defs/uncoded_concept_ref'}
        x-provenance: not_applicable
      several:     {type: boolean, default: false, x-provenance: not_applicable}
                   # hierarchy only: whether a concept may have more than one parent on this axis
      rule:        {$ref: '#/$defs/text',       x-provenance: not_applicable}
                   # for people, in the source language: what earns which value or which family
      proposed_by: {enum: [physician, maintainer, agent], x-provenance: not_applicable}   # a role, never a name
      views:       # one entry per view the axis is proposed for; a status is per view
        type: array
        minItems: 1
        items:
          type: object
          required: [view, status, since]
          additionalProperties: false
          properties:
            view:   {$ref: '#/$defs/view_ref'}
            status: {enum: [proposed, asserted, withdrawn]}
            since:  {$ref: '#/$defs/date'}
        x-provenance: not_applicable
      placements:  # the rule applied, while proposed: dimension {statement: value}, hierarchy {concept: parent};
                   # a list where the rule yields more than one place (the report's disjointness).
                   # Removed once asserted: edges and slot values carry the places with provenance
        type: object
        x-provenance: not_applicable
    allOf:
      - if: {required: [carrier], properties: {carrier: {const: dimension}}}
        then:
          required: [values]
          properties:
            several: {not: {}}   # a hierarchy's field (`{not: {}}` rather than `false`: the error then names the field)
            placements:
              propertyNames: {$ref: '#/$defs/statement_ref'}
              additionalProperties: {$ref: '#/$defs/place'}
      - if: {required: [carrier], properties: {carrier: {const: hierarchy}}}
        then:
          properties:
            values: {not: {}}    # a dimension's field
            placements:
              propertyNames: {$ref: '#/$defs/uncoded_concept_ref'}
              additionalProperties: {$ref: '#/$defs/place'}
  place:
    description: Where a placement puts something — one concept, or several where the rule yields more than one.
    anyOf:
      - $ref: '#/$defs/uncoded_concept_ref'
      - {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/$defs/uncoded_concept_ref'}}

  # ── edges ─────────────────────────────────────────────────────────────────
  # An edge is the tuple [from, kind, to, {properties}] (spec §5). Its id derives
  # from (from, kind, to) plus `discriminator` when parallel edges of one kind
  # exist; the validator checks uniqueness. Every edge carries `source`;
  # `modelling` where no document states the relation. An edge with textual
  # properties (rationale, guard) declares `lang` for them.
  edge_props:
    type: object
    required: [source]
    additionalProperties: false
    properties:
      source:        {$ref: '#/$defs/provenance_value'}
      lang:          {$ref: '#/$defs/lang'}
      discriminator: {$ref: '#/$defs/slug'}
      rationale:     {$ref: '#/$defs/text'}
      as_of:         {$ref: '#/$defs/date'}
      guard:         {}
      axis:          {$ref: '#/$defs/axis_ref'}   # broader only: the respect in which the subsumption holds (spec §4.1)
    dependentRequired:
      rationale: [lang]
  modelling_edge_props:
    description: 'Cross-source semantics are our assertions (spec §5) — always modelling, with rationale and date.'
    allOf:
      - $ref: '#/$defs/edge_props'
      - required: [source, rationale, as_of, lang]
        properties: {source: {const: modelling}}

  edge:
    type: array
    minItems: 4
    maxItems: 4
    prefixItems:
      - $ref: '#/$defs/entity_ref'
      - enum: [supports, contests, refines, supplements, limits, codes_as, broader,
               sequence, branch, about, specializes, complements, conflicts]
      - $ref: '#/$defs/entity_ref'
      - $ref: '#/$defs/edge_props'
    allOf:
      # evidence — the only edges that carry evidential weight
      - if: {prefixItems: [true, {enum: [supports, contests]}]}
        then: {prefixItems: [{$ref: '#/$defs/claim_ref'}, true, {$ref: '#/$defs/statement_ref'}]}
      # body-text relations — never inherit a recommendation's grade
      - if: {prefixItems: [true, {enum: [refines, supplements, limits]}]}
        then: {prefixItems: [{$ref: '#/$defs/claim_ref'}, true, {$ref: '#/$defs/claim_ref'}]}
      # coding — a code is a node, coding is an edge
      - if: {prefixItems: [true, {const: codes_as}]}
        then: {prefixItems: [{$ref: '#/$defs/concept_ref'}, true, {$ref: '#/$defs/terminology_ref'}]}
      # subsumption — "is a special case of", between uncoded concepts, modelling with a
      # rationale; carries no evidence and nothing is inherited along it (spec §5); acyclic (validator)
      - if: {prefixItems: [true, {const: broader}]}
        then:
          prefixItems: [{$ref: '#/$defs/uncoded_concept_ref'}, true, {$ref: '#/$defs/uncoded_concept_ref'},
                        {$ref: '#/$defs/modelling_edge_props'}]
      # a grouping axis is a respect of subsumption (spec §4.1): only `broader` carries `axis`. The
      # validator checks it names a hierarchy axis, that the edges of one axis form no cycle, and
      # that a concept has one parent per axis unless the axis says `several`
      - if: {prefixItems: [true, true, true, {required: [axis]}]}
        then: {prefixItems: [true, {const: broader}]}
      # structure — among structural nodes, and from them to statements
      - if: {prefixItems: [true, {const: sequence}]}
        then: {prefixItems: [{$ref: '#/$defs/structural_ref'}, true, {$ref: '#/$defs/structural_ref'}]}
      - if: {prefixItems: [true, {const: branch}]}
        then:
          prefixItems: [{$ref: '#/$defs/structural_ref'}, true, {$ref: '#/$defs/structural_ref'},
                        {required: [source, guard]}]
      - if: {prefixItems: [true, {const: about}]}
        then: {prefixItems: [{$ref: '#/$defs/structural_ref'}, true, {$ref: '#/$defs/statement_ref'}]}
      # cross-source semantics — statement → statement, modelling-only
      - if: {prefixItems: [true, {enum: [specializes, complements, conflicts]}]}
        then:
          prefixItems: [{$ref: '#/$defs/statement_ref'}, true, {$ref: '#/$defs/statement_ref'},
                        {$ref: '#/$defs/modelling_edge_props'}]
