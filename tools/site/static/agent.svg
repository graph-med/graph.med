<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="stick figure with the graph.med mark as its head">
  <defs><clipPath id="disc"><circle cx="50" cy="50" r="50"/></clipPath></defs>
  <g clip-path="url(#disc)">
    <rect width="100" height="100" fill="#d9dce1"/>
    <!-- the body: a stick figure, in the mark's black -->
    <g fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 48 V72"/>
      <path d="M37 66 L50 56 L63 66"/>
      <path d="M40 90 L50 72 L60 90"/>
    </g>
    <!-- the head: the graph.med mark (logo.svg), at 36 of its 100 -->
    <g transform="translate(32 12) scale(.36)">
      <rect width="100" height="100" rx="26" ry="26" fill="#000000"/>
      <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <path d="M62.3 29.7 A23 23 0 1 0 62.3 70.3" stroke-width="10.4"/>
        <g stroke-width="6.6">
          <path d="M43.5 50 H60"/>
          <path d="M60 50 L73 37"/>
          <path d="M60 50 L73 63"/>
          <path d="M60 50 H76.4"/>
        </g>
      </g>
      <g fill="#ffffff">
        <circle cx="73" cy="37" r="4.4"/>
        <circle cx="76.4" cy="50" r="4.4"/>
        <circle cx="73" cy="63" r="4.4"/>
      </g>
    </g>
  </g>
</svg>
