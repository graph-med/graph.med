# A ledger concept of views/vorhofflimmern-lf-1.1 (card #364): „Kardioversion“ (6.12–6.16, pp. 63–65; Tabelle 3, p.
# 14; the body text of chapters 6–8), medication-induced or electrical as the source prints it („durch
# medikamentöse/elektrische Kardioversion“, Tabelle 3, p. 14; „(medikamentös oder elektrisch)“, 6.14, p. 64). It is
# the measure the boxes judge (6.15, p. 65: „Eine Kardioversion kann … angeboten werden“), so intervention (spec
# §3.2: the measure a recommendation judges), not procedure, which spec §3.2 keeps for the operation that defines
# the case. Card #364's Decision 4 lists Kardioversion under procedure; it reads wider than spec §3.2, and the spec
# governs (the judge, 2026-10-11). Used by C1, C4, C5 and C7. Not 6.10's endpoint „Kardioversionen“ (p. 61), an
# outcome of C5's (card #364, Decision 4); „elektrische“ and „elektive Kardioversion“ are concepts of C5's beside
# it.
