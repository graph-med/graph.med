# A form of Tabelle 3 (p. 14), the AF form the first question of the tree asks (the maintainer, 2026-10-11, #314
# question 1): one of the five families axes/vorhofflimmern-population proposes under the scope root (card #364,
# Decisions 1 and 10). Labelled as the table prints the form, its row head with the table's head. 6.11 prints
# „langanhaltend persistierendem AF“ (p. 62): one concept, read as the table's form (card #364, reading 1, for the
# physician). Its rule is printed three ways — „mehr als 12 Monate“ (Tabelle 3, p. 14), „seit mindestens 12 Monaten“
# (p. 61), „Dauer über 1 Jahr“ (p. 62) —, so it reaches each printing by a defined_by edge of its own, every pair
# joined by disagrees_with, and no printing is chosen (#341; card #364, Decision 5): C1 writes the first, X1 the
# edges to C5's printings with the disagrees_with edges between the parts (proposed for the maintainer). p. 56
# prints „Persistierendes, insbesondere lang-persistierendes AF“ (l. 48), which reads long-persistent AF as a case
# of persistent AF, where Tabelle 3 prints the two as rows at one level, and draws a 12-month line counted from the
# diagnosis, not from continuous presence: „frühes Vorhofflimmern, das kürzer als 12 Monate besteht“ (l. 50–51) and
# „persistierendem AF (insbesondere, wenn das AF vor mehr als 12 Monaten diagnostiziert wurde)“ (l. 62–63). Each is
# a printing to keep, not to choose between (#341); showing them as claims and edges is the work of the part that
# reads p. 56 or of X2, not of this card.
