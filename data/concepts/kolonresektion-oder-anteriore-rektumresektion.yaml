id: concepts/kolonresektion-oder-anteriore-rektumresektion
type: concept
lang: de
label: Kolonresektion oder (tiefe) anteriore Rektumresektion
short_label: "Kolon- oder anteriore Rektumresektion"
facet: procedure
definition: Eine Kolonresektion oder eine (tiefe) anteriore Rektumresektion, gleich über welchen Zugang. Die
  Aufzählung ist eine Einschränkung, keine Umschreibung der kolorektalen Resektion; andere Rektumresektionen
  gehören nicht dazu.
source: modelling
