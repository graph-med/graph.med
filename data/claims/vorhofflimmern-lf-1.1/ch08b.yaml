# 8.7–8.10 (p. 86, l. 45 – p. 90, l. 64; the Literatur on pp. 91–92 is not read). Boxes 8.4–8.7, one claim per sentence
# (spec §3.1), the rule printed inside 8.6 (#328), Abb. 9's caption as the figure's side of a disagreement (spec §5; #341),
# and the body-text places spec §5.1 admits (#325, #341, #372), in page order. Ids: sha256("<at>|<quote>")[:8]. Line
# numbers are lines of `pdftotext -layout`.
# Every box prints „Neu 2024“ and its kind line („Adaptierte“, „Konsensbasierte“, „Evidenzbasierte Empfehlung“); both
# stay on the page (#314 Decision 5). Typos stay as printed (#314 Decision 4): „des Nebenwirkungsprofil“ (p. 87, l. 21),
# „bei gleichzeitig Abnahme“ (8.6, p. 89, l. 24); „Perikardektomie“ (p. 87, l. 26) as printed (#383 reading 9).

# Box 8.4 (p. 86, l. 48–60), in section 8.7: one sentence, ⇑⇑ with „EK“ beside it (a basis, #323), „Konsensstärke: 100%“.
# It delegates to Abb. 9, an image without a text layer (spec §5.1 F; #327): the claim is its sentence as printed, the
# delegation in its label. Its evidence cell prints, in place of a level, the basis „EK“ and the words beside it: „EK“ is
# the claim's basis, the words a note-only entry without a system, no row of the box being rated (spec §3.1; #326,
# 923dac1). The heading „Aussagesicherheit der Evidenz“ (l. 55) only names the column; the literature beside the cell names
# authors and stays on the page. No Begründung follows the box.
