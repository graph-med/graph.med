# Claims of card #382 (#314's part C7a) from chapter 8 of sources/vorhofflimmern-lf-1.1, „Spezielle Szenarien“, sections
# 8.1–8.6 (p. 78, l. 39 – p. 86, l. 44; chapter 7's Literatur on p. 78, l. 1–38 is not read). Boxes 8.1–8.3, one claim per
# sentence, each delegating to a figure without a text layer (spec §3.1, §5.1 F); Tabelle 16 as §5.1 K reads it; the
# body-text places §5.1 admits against 8.1–8.3; the recommendations and declines of §§8.3–8.5.2, which hold no box, as
# claims without an edge (§5.1 U; #325); the footnotes of Abb. 6 and 7 that print, in the text layer, a rule the body text
# prints otherwise (#379); and the captions of Abb. 7 and 8 as the figures' sides of what their images print otherwise
# (spec §5; #341). In page order. Ids: sha256("<at>|<quote>")[:8]. Line numbers are lines of `pdftotext -layout`.
# Every box prints its kind line and „Neu 2024“; both stay on the page (#314 Decision 5). Abb. 6–8 are raster images
# (`pdfimages` lists one on each of pp. 81–83, none on p. 80): their content stays on the page (§5.1 F).

