# p. 22, l. 30; the Literatur from p. 22, l. 31 is not read). Boxes 2.1–2.6, one claim per sentence (spec §3.1), 2.5's
# lettered parts each with its own grade and share, Tabellen 4 and 5 (spec §5.1 K), and the body-text places spec
