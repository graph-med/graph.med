# Claims of card #380 (#314's part C1) from chapter 1 of sources/vorhofflimmern-lf-1.1, „Definition, Einteilung und
# Epidemiologie von Vorhofflimmern“ (p. 11 from the heading of 1, l. 44, to p. 14; p. 15 is the Literatur, not read).
# The chapter holds no box. Its definitions and criteria are claims where spec §5.1 G1's definition clause admits them —
# a heading or table head that calls them a definition, classification or criterion, for a term a box uses (#325
# Decision 5 and checklist case 1; #314 Decision 18) —, each reached by its concept's defined_by edge and carrying no
# body-text edge, E's included; and the unmarked recommendations §5.1 U admits, claims without an edge and in no
# statement. Ids: sha256("<at>|<quote>")[:8]. Line numbers are lines of `pdftotext -layout`.
# Stays on the page (#380 Decision 4): p. 11, l. 47–52 (consequences, Abb. 1's mention) and l. 56–59 (the duration's
# basis and the AF-Last's parenthesis, reading 4: concepts/af-last stays stated); Abb. 1 (p. 12, a raster image; its
# caption l. 10 a title, G3); §1.3's AHRE and DDAF (p. 12, l. 16–22, 24–31) and Tabelle 2's DDAF row (p. 13, l. 11–16),
# which no box uses; §1.4's other sentences (p. 13, l. 22–27, 29–35, 36–38); §1.5 and §1.7's epidemiology; §1.6's
# classes and the „Trigger“ induced AF (p. 13, l. 50–56); Tabelle 3's footnote „*“ (p. 14, l. 22–24).

# §1.1 „Definition“ (p. 11, l. 46–47): the definition of the diagnosis, its first sentence; concepts/vorhofflimmern
# reaches it by defined_by (reading 1 (b)). Its other sentences (l. 47–52) state consequences and stay.
- id: claims/vorhofflimmern-lf-1.1/0c25853f
  type: claim
  lang: de
  kind: definition
  section: "1.1"
  label: "Vorhofflimmern (AF) ist durch schnelle, unkoordinierte elektrische Aktivierung des Vorhofmyokards gekennzeichnet."
  source:
    at: sources/vorhofflimmern-lf-1.1#page=11
    quote: "Vorhofflimmern (AF) ist durch schnelle, unkoordinierte elektrische Aktivierung des Vorhofmyokards"
# §1.2 „Diagnostische Kriterien“ (p. 11, l. 55 – p. 12, l. 5): the first printing of the rule of the diagnosis. Its
# first sentence is the top (reading 1 (b), the leaning): the passage lists the duration (l. 55–56) and the ECG
# characteristics (p. 12, l. 4–5) without saying how they combine — not_stated, no connective. The duration's own
# reference marks „[5, 6]“ are left out of its label. concepts/diagnostiziertes-vorhofflimmern reaches this top by
# defined_by, and the top is joined by disagrees_with to the other two printings (Tabelle 2, p. 16; #341).
- id: claims/vorhofflimmern-lf-1.1/ff95c179
  type: claim
  lang: de
  kind: criterion
  section: "1.2"
  label: "Die Diagnose von AF erfolgt mittels eines Elektrokardiogramms (EKG)."
  combination:
    operator: not_stated
    of: [claims/vorhofflimmern-lf-1.1/aad6f10f, claims/vorhofflimmern-lf-1.1/9aace7ec]
    rationale: "Die Diagnostischen Kriterien (S. 11, Z. 55 – S. 12, Z. 5) nennen nach „Die Diagnose von AF erfolgt mittels eines Elektrokardiogramms (EKG).“ die erforderliche Dokumentation mit ihrer Dauer und die EKG-Charakteristika, ohne zu sagen, wie beide zusammen gelten."
  source:
    at: sources/vorhofflimmern-lf-1.1#page=11
    quote: "Die Diagnose von AF erfolgt mittels eines Elektrokardiogramms (EKG)."
# §1.2, the duration (p. 11, l. 55–56): „entweder … oder“ joins two ECG kinds, each sufficing, and the duration „für 30
# Sekunden“ stands on the member it follows (reading 2, its first option; the other reads it as binding both). The
# line breaks inside „12-Kanal-EKG“ (l. 55–56), where the hyphen belongs to the word.
- id: claims/vorhofflimmern-lf-1.1/aad6f10f
  type: claim
  lang: de
  kind: criterion
  section: "1.2"
  label: "Es ist entweder eine Dokumentation im 12-Kanal-EKG oder im Ein- oder Mehrkanal-EKG für 30 Sekunden erforderlich."
  combination:
    operator: any_of
    of: [claims/vorhofflimmern-lf-1.1/b1d80426, claims/vorhofflimmern-lf-1.1/3ae08e1e]
    connective: "entweder … oder"
    source: {at: sources/vorhofflimmern-lf-1.1#page=11, quote: "entweder eine Dokumentation im 12-Kanal-EKG oder"}
    rationale: "„Es ist entweder eine Dokumentation im 12-Kanal-EKG oder im Ein- oder Mehrkanal-EKG für 30 Sekunden erforderlich“: „entweder … oder“ verbindet zwei EKG-Arten, jede genügt (ODER); die Dauer steht beim Glied, dem sie folgt, dem Ein- oder Mehrkanal-EKG."
  source:
    at: sources/vorhofflimmern-lf-1.1#page=11
    quote: "Es ist entweder eine Dokumentation im"
# The duration's first member: the 12-lead ECG, a leaf without a threshold (reading 2).
- id: claims/vorhofflimmern-lf-1.1/b1d80426
  type: claim
  lang: de
  kind: criterion
  section: "1.2"
  label: "eine Dokumentation im 12-Kanal-EKG"
  source:
    at: sources/vorhofflimmern-lf-1.1#page=11
    quote: "eine Dokumentation im 12-Kanal-EKG"
# The duration's second member: „Ein- oder Mehrkanal-EKG“ names one kind of ECG (members sharing one answer are one
# claim, spec §5.1 K), with the duration as printed: „für 30 Sekunden“, read `=` (reading 2; the other reading is `≥`),
# on concepts/dauer-der-ekg-dokumentation.
- id: claims/vorhofflimmern-lf-1.1/3ae08e1e
  type: claim
  lang: de
  kind: criterion
  section: "1.2"
  label: "im Ein- oder Mehrkanal-EKG für 30 Sekunden"
  threshold: {quantity: concepts/dauer-der-ekg-dokumentation, comparator: "=", value: "30", unit: "Sekunden"}
  source:
    at: sources/vorhofflimmern-lf-1.1#page=11
    quote: "im Ein- oder Mehrkanal-EKG für 30 Sekunden"
# §1.2 continued on p. 12 (l. 4–5), before the heading of 1.3 (l. 15): the ECG characteristics, a part of the top above.
- id: claims/vorhofflimmern-lf-1.1/9aace7ec
  type: claim
  lang: de
  kind: criterion
  section: "1.2"
  label: "Die EKG-Charakteristika umfassen unregelmäßige atriale Aktivierung ohne abgrenzbare, gleichförmige P-Wellen im EKG und in der Regel absolut arrhythmische Herzaktionen."
  source:
    at: sources/vorhofflimmern-lf-1.1#page=12
    quote: "Die EKG-Charakteristika umfassen unregelmäßige atriale Aktivierung ohne abgrenzbare"
# Section 1.3 (p. 12, l. 26–27): in the guideline's voice, on the confirmation of a device-detected diagnosis before
