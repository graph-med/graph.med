# Box 3.1 (p. 24, l. 36–57), in section 3.1: one sentence whose two items print „•“ (l. 40–41), ⇑ on its third line,
# „Konsensstärke: 100%“. The verb is the finite modal of „sollte … empfohlen werden“ (spec §3.1, step 1; #325 Decision
# 10). Its evidence block, four rows in printed order (spec §3.1; #326 Decision 8): „Vermeidung ischämischer
# Schlaganfälle: gering“ rates the endpoint ischämische Schlaganfälle, the aim word „Vermeidung“ left out (card #364,
# reading 8); „Detektion von Vorhofflimmern“ and „Initiierung Antikoagulation“ are endpoints of their own, as printed
# (reading 11); „Blutungen“ is concepts/blutungsrate (card #364, reading 9). The literature cell stays on the page. The
# Begründung rates the evidence in other words (p. 25): disagrees_with.
