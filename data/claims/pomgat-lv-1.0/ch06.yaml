  label: "… die Drainage-Amylase im früh-postoperativen Verlauf als Indikator eines geringen Risikos einer späteren Pankreasfistel; im Einzelnen waren dies entweder eine Amylase-Konzentration im Drainagesekret unter 5000 U/L am ersten postop. Tag, oder eine Amylase-Konzentration im Drainagesekret unter 5000 U/L am postop. Tag 1 und 3 sowie Drainagemenge unter 300 ml/Tag oder aber Amylase im Drainagesekret kleiner als das Dreifach der Serumkonzentration am postop. Tag 3"
