  lang: de
  kind: fact
  section: "9.1"
  label: "Die Nutzung von Behandlungskonferenzen zur Identifizierung von Patientenverfügungen und von Behandlungszielen innerhalb von 72 Stunden ab dem Zeitpunkt der Aufnahme auf der Intensivstation fördert nachweislich die Kommunikation und die Verständigung zwischen der Familie des Patienten und dem Behandlungsteam, verbessert die Angehörigenzufriedenheit, verringert Stress, Ängste und Depressionen bei den Angehörigen, erleichtert die Entscheidungsfindung zur Sterbebegleitung und verkürzt die Aufenthaltsdauer auf der Intensivstation bei Patienten, die versterben."
