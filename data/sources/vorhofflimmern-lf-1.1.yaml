id: sources/vorhofflimmern-lf-1.1
type: source
lang: de
kind: leitlinie
title: S3-Leitlinie Vorhofflimmern   # the title proper: the cover prints "S3-Leitlinie" (p. 1, l. 8) and "Vorhofflimmern" (l. 12),
                                     # the citation line (p. 4, l. 15) joins them; the running header's "S3-LL" is an abbreviation
short_label: S3 Vorhofflimmern 2025
version:   # spec §6.1: the source prints its version two ways, and nothing on what changed from 1 to 1.1; each printing is
           # recorded with its own quotes, in the order of the pages that first print it, none chosen (#366)
  - version: "1.1"   # the cover (p. 1, l. 14) and the register sheet (p. 93, l. 1), whose „1.1“ stands in a column of its own
                     # beside „Versionsnummer:“, so its quote is the label alone
    source:
      - {at: sources/vorhofflimmern-lf-1.1#page=1, quote: "Version 1.1"}
      - {at: sources/vorhofflimmern-lf-1.1#page=93, quote: "1.1"}
  - version: "1"     # the citation line (p. 4, l. 15–16), which ends each of its parts in a full stop („Deutsche Gesellschaft für
                     # Kardiologie. S3-Leitlinie Vorhofflimmern – Version 1. Internet: www.awmf.org.“), and the methods
                     # paragraph's „Leitlinienreport zur Version 1“ (p. 11, l. 27–28), which prints the label without one
    source:
      - {at: sources/vorhofflimmern-lf-1.1#page=4, quote: "S3-Leitlinie Vorhofflimmern – Version 1."}
      - {at: sources/vorhofflimmern-lf-1.1#page=11, quote: "Leitlinienreport zur Version 1 der S3-Leitlinie Vorhofflimmern"}
date: "2025-04-14"   # the running header's "Stand 14.04.2025"; p. 4 dates the adoption (11.02.2025) and p. 93 the first
                     # publication (02/2025), neither the date the source gives its version (spec §6.1)
provenance:   # spec §6.1: the running header
  date: {at: sources/vorhofflimmern-lf-1.1#page=1, quote: "Stand 14.04.2025"}
awmf_register: "019-014"
url: https://register.awmf.org/assets/guidelines/019-014l_S3_Vorhofflimmern_2025-07.pdf
content_hash: sha256:4c1d93f32481b632de9567e82f758df124cbffa7815992d9d5f75da3081bad6e
media_type: application/pdf
license: "Deutsche Gesellschaft für Kardiologie und 16 weitere Herausgeber, publiziert im AWMF-Register (019-014); laut
  „Besonderer Hinweis“ (S. 2): „Jede Verwertung außerhalb der Bestimmung des Urheberrechtsgesetzes ist ohne schriftliche
  Zustimmung der Träger des NVL-Programms unzulässig und strafbar.“"   # p. 3: under „Herausgeber“ the DGK „sowie“ 16
  # organisations; p. 2, l. 22–24: the notice as printed, naming whose consent it requires (#363 Decision 4)
structure: [versorgungspfad, modalitaetsbezogen]   # chapters 2–4 diagnose, screen and prevent; 5–7 treat by modality
                                                   # (stroke prevention, rhythm control, rate control); 8 collects situations
grading_scheme:   # spec §3.1: Tabelle 1 (p. 10), quoted cell by cell; the basis from the boxes and a Begründung (p. 44)
  grades:   # Tabelle 1's rows in the table's order; the letter of the column „Empfehlungsgrad“ is quoted, kept in no field
    - grade: "⇑⇑"
      description: Starke Positiv-Empfehlung
      verb: soll
      negated: soll nicht
      direction: for
      source:
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "⇑⇑"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "soll"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "Starke Positiv-Empfehlung"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "A"}
      provenance:   # the row prints the affirmative only; the row of ⇓⇓ prints the form against
        negated: {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "soll nicht"}
    - grade: "⇑"
      description: Positiv-Empfehlung
      verb: sollte
      negated: sollte nicht
      direction: for
      source:
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "⇑"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "sollte"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "Positiv-Empfehlung"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "B"}
      provenance:   # as for ⇑⇑: the row of ⇓
        negated: {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "sollte nicht"}
    - grade: "⇔"
      description: Offene Empfehlung
      verb: kann
      negated: kann verzichtet werden
      open: true
      source:
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "⇔"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "kann erwogen werden/kann verzichtet werden"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "Offene Empfehlung"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "0"}
      rationale: "Die Zeile druckt zwei Formulierungen, „kann erwogen werden/kann verzichtet werden“. Die Formulierung ist das
        Modalverb „kann“, wie jede andere Zeile der Spalte ein Modalverb gibt, und „kann verzichtet werden“ ist ihre Form gegen
        etwas. In den Kästen 4.4 (S. 31), 6.13 (S. 63), 6.15 (S. 65) und 6.17 (S. 66) zeigt die gedruckte Seite ⇔, die
        Textebene aber ein Zeichen des privaten Unicode-Bereichs (U+F0F3): ihre Sätze tragen den Grad ⇔, und seine Herkunft
        zitiert die Zelle, wie die Textebene sie gibt."
    - grade: "⇓"
      description: Negativ-Empfehlung
      verb: sollte
      negated: sollte nicht
      direction: against
      source:
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "⇓"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "sollte nicht"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "Negativ-Empfehlung"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "B"}
    - grade: "⇓⇓"
      description: Starke Negativ-Empfehlung   # the cell breaks after „Negativ-“; the quote runs across the line
      verb: soll
      negated: soll nicht
      direction: against
      source:
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "⇓⇓"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "soll nicht"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "Starke Negativ-Empfehlung"}
        - {at: sources/vorhofflimmern-lf-1.1#page=10, quote: "A"}
  bases:
    - basis: EK
      description: Expertenkonsens
      source:
        - {at: sources/vorhofflimmern-lf-1.1#page=44, quote: "EK"}
        - {at: sources/vorhofflimmern-lf-1.1#page=44, quote: "Die Empfehlung beruht auf Expertenkonsens und beschreibt gute klinische Praxis."}
      rationale: "Tabelle 1 nennt „EK“ nicht, und die Langfassung schreibt es nirgends aus. Die Kästen drucken es neben dem
        Pfeil, in jeder „Konsensbasierten“ und „Adaptierten Empfehlung“, und mit „Statement“ ohne Pfeil in den „Konsensbasierten
        Statements“; die Begründung von Empfehlung 5.9, deren Kasten „⇑“ und „EK“ druckt, sagt, worauf sie beruht. Den Pfeil
        eines solchen Kastens nennt der Text seinen Empfehlungsgrad (S. 20 zu 2.4, S. 21 zu 2.5): EK ist kein Grad, sondern
        die Grundlage der Empfehlung, und ihre Stärke gibt der Pfeil."
  # no consensus classes: the boxes print the share („Konsensstärke: 96,8 %“), and no page names a class or its bounds
  # (p. 11 refers to the Leitlinienreport); a claim carries `consensus_share` as printed and no `consensus`
rating_systems:   # spec §3.1: the Langfassung prints no method line and leaves its method to the Leitlinienreport, which is
                  # not declared (#314 question 6, answered 2026-10-11); the system is named by a body-text line beside a rating
  - system: grade
    name: GRADE
    source: {at: sources/vorhofflimmern-lf-1.1#page=29, quote: "GRADE moderat"}
    rationale: "Die Langfassung druckt keine Zeile zur Methode der Evidenzbewertung; für die Methodik, darunter „Auswahl und
      Bewertung der Evidenz“, verweist sie auf den Leitlinienreport zur Version 1 (S. 11). Ihre Kästen überschreiben ihre
      Bewertungen mit „Aussagesicherheit der Evidenz“, so Empfehlung 4.1 (S. 29), die Kästen 2.1 (S. 16), 2.3 (S. 18), 3.1
      (S. 24) und 8.6 (S. 89) mit „Qualität der Evidenz“; ihre bewerteten Zeilen drucken die Bewertung mit ⊕-Symbolen. Ihre
      Begründungen nennen GRADE neben einer solchen Bewertung, hier „GRADE moderat“ (S. 29)."
