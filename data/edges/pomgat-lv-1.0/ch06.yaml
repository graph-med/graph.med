- - statements/icg-pruefung-kolorektale-anastomose
  - specializes
  - statements/perfusionspruefung-kolorektale-anastomose
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "6.15 („Hierbei kann die Vaskularisation intraoperativ durch Fluoreszenzangiographie mit dem Farbstoff Indocyaningrün (ICG) überprüft werden“) nennt ein Verfahren der Perfusionsprüfung, die 6.14 nach Rektum- und Kolonresektionen fordert: dieselbe Anastomose, die Handlung ein Sonderfall. Der Text sagt es selbst (S. 74: „Hierbei kann insbesondere die Fluoreszenz-Angiographie mit ICG eingesetzt werden“)."
- - statements/perfusionspruefung-kolorektale-anastomose
  - complements
  - statements/dichtigkeitspruefung-rektumanastomose
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "Die Perfusionsprüfung (6.14) steht neben der Dichtigkeitsprüfung (6.13), sie ersetzt sie nicht: „Dass neben der Überprüfung der Dichtigkeit einer Anastomose (siehe gesonderte Empfehlung) auch die intraoperative Überprüfung einer guten Perfusion … sichergestellt werden soll“ (S. 72 f.); „wobei die Tests auch kombiniert werden können“ (S. 71). Die Dichtigkeitsprüfung gilt für Anastomosen zum Rektum, die Perfusionsprüfung nach Rektum- und Kolonresektionen."
- - statements/fruehe-drainageentfernung-pankreasresektion
  - complements
  - statements/drainage-pankreasresektion-optional
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "6.7 (die abdominelle Drainage kann bis zum 4. postoperativen Tag gezogen werden, wenn das Drainagesekret ein geringes Fistelrisiko anzeigt) ist der nächste Schritt für die Drainage, deren Einlage 6.5 nach Pankreasresektion erwägen lässt: dieselbe Population, dieselbe Drainage („die abdominelle Drainage“), eine Handlung danach."
