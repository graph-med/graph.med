- - statements/kaffeekonsum-ab-aufwachraum
  - specializes
  - statements/kaffee-nach-abdominalchirurgie
  - source: modelling
    rationale: "Box 7.25: „Der Kaffee-Konsum kann bereits im Aufwachraum begonnen werden“ sagt, ab wann der angebotene koffeinierte Kaffee nach abdominalchirurgischen Operationen getrunken werden kann — ein Sonderfall derselben Maßnahme"
    lang: de
    as_of: "2026-09-23"
- - statements/akupunkturpunkte-zusanli-shangjuxu
  - specializes
  - statements/akupunktur-nach-abdominalchirurgie
  - source: modelling
    rationale: "Box 7.28: „Hierfür sollten die Akupunkturpunkte ZuSanLi und ShangJuXu … genutzt werden“ — die Akupunktur an diesen Punkten ist ein Sonderfall der Akupunktur nach abdominalchirurgischen Eingriffen"
    lang: de
    as_of: "2026-09-23"
- - statements/kaugummi-kolorektal
