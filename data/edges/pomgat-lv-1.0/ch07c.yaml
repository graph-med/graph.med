  - statements/kaugummi-offene-leberresektion
  - source: modelling
    rationale: "Abschnitt 7.4.2.2 Kaugummi: dieselbe Maßnahme (Kaugummikauen) für zwei getrennte Populationen, kolorektale Resektionen (7.26, sollte) und offene Leberresektionen (7.27, kann); keine ist ein Sonderfall der anderen"
    lang: de
    as_of: "2026-09-23"
