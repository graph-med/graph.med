# cross-statement edges (spec §5): our assertions between statements, never from a claim
- - statements/magensonde-fruehe-entfernung-oesophagektomie
  - complements
  - statements/doppellumige-magensonde-oesophagektomie
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "Empfehlung 7.2 sagt, wann die nach 7.1 intraoperativ eingelegte Magensonde entfernt werden kann; beide betreffen
      dieselbe Sonde nach transthorakaler Ösophagektomie (N1: zwischen Empfehlungen, nicht als Leitlinientext)."
- - statements/dauerkatheter-verlaengert-bei-harnverhaltrisiko
  - specializes
  - statements/dauerkatheter-entfernung-24h-kolorektal
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "Der zweite Satz der Empfehlung 7.7 gilt für die Teilgruppe der kolorektalen Resektionen mit Risikofaktoren für
      einen Harnverhalt und erlaubt dort statt der Entfernung in 24 Stunden eine Ableitung bis zum 3. postoperativen Tag (N1)."
- - statements/tap-block-mic-kolorektal
  - specializes
  - statements/periphere-regionalanalgesie-viszeralchirurgie
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "Der TAP-Block ist ein peripheres Regionalanalgesieverfahren (Kapitel 7.3.2 und 7.3.3 zählen ihn zu den PRA),
      minimalinvasive Kolon- und anteriore Rektumresektionen sind onkologisch-viszeralchirurgische Eingriffe; 7.12 sagt für
      diesen Fall dasselbe „kann“ wie 7.13."
- - statements/tap-block-mic-kolorektal
  - complements
  - statements/epiduralanalgesie-mic-bei-risikokonstellation
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "7.12 nennt den TAP-Block ausdrücklich als Alternative zur EA bei minimalinvasiven kolorektalen Eingriffen; 7.10
      sagt, wann bei MIC-Eingriffen eine EA eingesetzt werden kann. Beide sind „kann“ und schließen einander nicht aus."
- - statements/periphere-regionalanalgesie-viszeralchirurgie
  - complements
  - statements/epiduralanalgesie-ueberlegen-peripherer-regionalanalgesie
  - source: modelling
    lang: de
    as_of: "2026-09-23"
    rationale: "7.13 erlaubt ein peripheres Regionalanalgesieverfahren gegenüber systemischer Schmerztherapie, 7.11 stellt die
      EA den PRA als überlegen gegenüber; zusammen ordnen sie die drei Verfahren, ohne einander zu widersprechen."
