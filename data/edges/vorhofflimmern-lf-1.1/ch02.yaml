# disagreement (spec §5, §5.1 D and K; #341; #380 Decision 5): p. 16's printing against the two of chapter 1
- [claims/vorhofflimmern-lf-1.1/a11a0b09, disagrees_with, claims/vorhofflimmern-lf-1.1/ff95c179, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Der Hintergrund zu 2.1 (S. 16, Z. 17–18) nennt für die Diagnose eine EKG-Dokumentation „mittels eines Ein- oder Mehr-Kanal-EKG über eine Dauer von >30 Sekunden (s. Kapitel 1)“; Kapitel 1 (S. 11, Z. 55–56) verlangt „entweder eine Dokumentation im 12-Kanal-EKG oder im Ein- oder Mehrkanal-EKG für 30 Sekunden“. Die beiden Stellen nennen die Dauer mit verschiedenem Vergleich, „>30 Sekunden“ und „für 30 Sekunden“, und Kapitel 1 nennt das 12-Kanal-EKG als eigene Möglichkeit, S. 16 nicht. Keine Angabe ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/a11a0b09, disagrees_with, claims/vorhofflimmern-lf-1.1/0bd856d2, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Der Hintergrund zu 2.1 (S. 16, Z. 17–18) nennt für die Diagnose eine EKG-Dokumentation „mittels eines Ein- oder Mehr-Kanal-EKG über eine Dauer von >30 Sekunden (s. Kapitel 1)“; Tabelle 2 (S. 13), Zeile „Klinisches Vorhofflimmern“: „AF im 12-Kanal-EKG oder 1-Kanal-EKG über mindestens 30s“. Die beiden Stellen nennen die Dauer mit verschiedenem Vergleich, „>30 Sekunden“ und „mindestens 30s“, und verschiedene EKG-Arten, das „Ein- oder Mehr-Kanal-EKG“ und das 12-Kanal- oder 1-Kanal-EKG. Keine Angabe ist gewählt."}]

