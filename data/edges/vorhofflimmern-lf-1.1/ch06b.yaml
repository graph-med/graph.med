# disagreement (spec §5, §5.1 D; #341): each printing kept as printed and shown, none chosen — the two definitions of
# long-persistent AF on these pages (their edges to C1's Tabelle 3 are X1's), and the places that answer a term of a
# box otherwise: a group (6.11, 6.14's exception), a technique (6.14), a time (6.16)
- [claims/vorhofflimmern-lf-1.1/267a1e23, disagrees_with, claims/vorhofflimmern-lf-1.1/18d45496, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Abschnitt 6.7 definiert das lang-persistierende AF zweimal: „(definiert als AF, das seit mindestens 12 Monaten persistiert)“ (S. 61, Z. 58–59) und „(definiert als Dauer über 1 Jahr)“ (S. 62, Z. 36). Die eine Grenze schließt 12 Monate ein („mindestens“), die andere verlangt mehr als ein Jahr („über“); keine ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/8d887787, disagrees_with, claims/vorhofflimmern-lf-1.1/a7900b9e, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Empfehlung 6.11 (S. 62): das Hybrid-Verfahren „Bei symptomatischen Patient*innen mit langanhaltend persistierendem AF sowie dilatiertem linken Vorhof“; der Hintergrund (S. 61, Z. 64–66): „eine Empfehlung für eine interdisziplinäre Evaluation einer Hybridtherapie für symptomatische Patient*innen mit lang-persistierendem AF“. Der Text nennt die Gruppe ohne den dilatierten linken Vorhof, den der Kasten verlangt."}]
- [claims/vorhofflimmern-lf-1.1/2c0f14f0, disagrees_with, claims/vorhofflimmern-lf-1.1/49da81bb, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Empfehlung 6.14 (S. 64): „ein Thrombenausschluss mittels transösophagealem Ultraschall“; der Hintergrund (S. 64, Z. 11–12): „ein in der Regel echokardiographischer Ausschluss (alternativ ggfs. CT oder MRT möglich) eines intrakardialen Thrombus“. Der Text nennt als Alternative eine andere Technik, die der Kasten nicht nennt."}]
- [claims/vorhofflimmern-lf-1.1/2c0f14f0, disagrees_with, claims/vorhofflimmern-lf-1.1/3b5983bd, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Empfehlung 6.14 (S. 64): „ein Thrombenausschluss mittels transösophagealem Ultraschall“; die Begründung (S. 64, Z. 49): „einen Thrombenausschluss mittels Bildgebung“. Der Kasten nennt eine Technik, der Text die Bildgebung allgemein."}]
- [claims/vorhofflimmern-lf-1.1/eb18d2f3, disagrees_with, claims/vorhofflimmern-lf-1.1/11819a4f, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Empfehlung 6.14 (S. 64), Satz 2: „Eine Ausnahme stellen Patient*innen mit AF <24h und geringem thromboembolischem Risiko dar.“; der Hintergrund (S. 64, Z. 15–19): „Besteht das AF kürzer als 24 h oder erfolgt eine pharmakologische Kardioversion im Rahmen einer \"pill-in-the-pocket\"-Therapie, kann bei Patient*innen ohne Indikation für eine dauerhafte Antikoagulation … auf diese verzichtet werden“. Der Text nennt für die Ausnahme eine andere Gruppe: auch die Kardioversion einer „pill-in-the-pocket“-Therapie, und „ohne Indikation für eine dauerhafte Antikoagulation“, wo der Kasten „geringem thromboembolischem Risiko“ druckt."}]
- [claims/vorhofflimmern-lf-1.1/2251b543, disagrees_with, claims/vorhofflimmern-lf-1.1/0a1ddd56, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Empfehlung 6.16 (S. 65): „Nach Kardioversion soll daher das weiterführende Management geplant werden.“; der Hintergrund (S. 65, Z. 35): „Bei der Planung einer Kardioversion empfiehlt die Leitliniengruppe, ein langfristiges Therapiekonzept festzulegen“. Der Kasten plant nach der Kardioversion, der Text schon bei ihrer Planung."}]
- [claims/vorhofflimmern-lf-1.1/0a1ddd56, disagrees_with, claims/vorhofflimmern-lf-1.1/67f9ae24, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Abschnitt 6.8.5 nennt zwei Zeitpunkte für das langfristige Therapiekonzept: „Bei der Planung einer Kardioversion“ (Hintergrund, S. 65, Z. 35) und „dass ein langfristiges Therapiekonzept nach Kardioversion geplant werden soll“ (Begründung, S. 65, Z. 60–61): vor und nach der Kardioversion."}]
