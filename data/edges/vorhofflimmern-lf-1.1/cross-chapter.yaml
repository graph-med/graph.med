- [concepts/kardiale-resynchronisationstherapie-mit-anschliessender-av-knoten-ablation, broader, concepts/frequenzkontrolle, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Die kardiale Resynchronisations-Therapie mit anschließender AV-Knoten-Ablation ist eine Frequenzkontrolle: die AV-Knoten-Ablation mit einem CRT-System als Schrittmacher; S. 74 (Z. 10): „die intensive interventionelle Frequenzkontrolle mittels AV-Knoten-Ablation und CRT-Implantation“."}]
- [concepts/pruefung-der-indikation-zur-oralen-antikoagulation, broader, concepts/pruefung-der-indikation-zur-antikoagulation, {source: modelling, as_of: "2026-10-12", lang: de,
