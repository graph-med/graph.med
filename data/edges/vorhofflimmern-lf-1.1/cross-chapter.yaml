# subsumption (spec §5; #227 Outcome 2; card #394 reading 19): families across parts of outcome and action concepts,
# "X is a Y" in any guideline, a member sharing its family's facet; no family concept minted, none within one part.
# Not written, and why: 7.1's and 7.2's targets under frequenzkontrolle (a target is no therapy);
# wirkstoffe-zur-frequenzkontrolle (a drug class); pill-in-the-pocket-therapie under klasse-ic-antiarrhythmika (an
# intervention under a medication); herzinsuffizienzbedingte-hospitalisierungen (finding) under hospitalisierung;
