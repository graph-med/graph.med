# scope edges (spec §5 `in_scope_of`): "counts, within the scope of this guideline, as a case of" — what the
# guideline stipulates for its own scope and `broader` cannot hold, because it is not true whatever guideline one
# reads. All modelling with a rationale; `condition` names the circumstance under which the membership holds, its
# absence means unconditional. With broader-edges.yaml they form the scope tree of views/vorhofflimmern-lf-1.1,
# which ends in its scope_root, the patients with AF whose care the guideline means to optimise (Zielsetzung,
# p. 10, l. 55–57). Card #393 (#314's part X2), one edge per placement of axes/vorhofflimmern-population and no
# other. No scope edge runs from a concept another source uses.

# ── the groups whose members the box addresses all have AF, unconditionally: AF is printed beside the group, in
# the box's measure or aim, or in the section or chapter the box stands in, or in the box it refers back to (card
# #364, convention rows 5, 7 and 8, reading 7); heart failure, the family of 6.4's and 7.4's groups. Each at the root
- [concepts/positives-screening-auf-eine-psychische-stoerung, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 2.5 b) nennt Patient*innen „Bei positivem Screening auf eine psychische Störung“ (S. 21, Z. 23); sie steht unter §2.3.2 „Erfassung von Begleiterkrankungen sowie der psychosozialen Komponente bei Patient*innen mit Vorhofflimmern“ (S. 21, Z. 5–6) und nennt keine Form. Im Geltungsbereich der Leitlinie gehört die Gruppe zu den Patient*innen mit Vorhofflimmern, deren Versorgung die Leitlinie laut ihrer Zielsetzung optimieren will (S. 10, Z. 55–57); jedes Mitglied hat Vorhofflimmern, daher ohne Bedingung. Allgemein hat nicht jede*r mit positivem Screening auf eine psychische Störung Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/starke-psychovegetative-belastung, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 4.4 nennt „Patient*innen mit AF mit starker psychovegetativer Belastung“ (S. 31, Z. 46–47): Vorhofflimmern und ein Zustand, der Zustand als gedruckt. Im Geltungsbereich der Leitlinie ist die starke psychovegetative Belastung ein Zustand ihrer Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), ohne Bedingung. Allgemein hat nicht jede*r mit starker psychovegetativer Belastung Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/patientinnen-mit-cha2ds2-va-score-ab-2, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 5.4 nennt „Bei einem ermittelten CHA2DS2-VA Score von ≥2“ (S. 40, Z. 43), Box 6.2 „Patient*innen mit AF und relevanten kardiovaskulären Risikofaktoren, höherem Lebensalter oder Komorbiditäten (CHA2DS2-VA Score ≥2)“ (S. 50, Z. 30–32). Den Score setzt die Leitlinie „bei Patient*innen mit AF“ ein (5.1, S. 38, Z. 7–8), und Kapitel 5 spricht von Patient*innen mit AF (S. 37, Z. 40–44). Im Geltungsbereich der Leitlinie gehört die Gruppe zu den Patient*innen mit Vorhofflimmern, deren Versorgung die Leitlinie laut ihrer Zielsetzung optimieren will (S. 10, Z. 55–57), ohne Bedingung. Ein Score-Wert allein nennt kein Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/patientinnen-mit-cha2ds2-va-score-1, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 5.4 nennt „Bei einem ermittelten CHA2DS2-VA Score von 1“ (S. 40, Z. 45). Den Score setzt die Leitlinie „bei Patient*innen mit AF“ ein (5.1, S. 38, Z. 7–8), und Kapitel 5 spricht von Patient*innen mit AF (S. 37, Z. 40–44). Im Geltungsbereich der Leitlinie gehört die Gruppe zu den Patient*innen mit Vorhofflimmern, deren Versorgung die Leitlinie laut ihrer Zielsetzung optimieren will (S. 10, Z. 55–57), ohne Bedingung. Ein Score-Wert allein nennt kein Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/orale-antikoagulation-kontraindiziert, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 5.8 nennt „Patient*innen mit AF“, „bei denen eine orale Antikoagulation kontraindiziert ist“ (S. 43, Z. 43–44). Im Geltungsbereich der Leitlinie ist die Kontraindikation ein Zustand ihrer Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), ohne Bedingung. Allgemein hat nicht jede*r mit kontraindizierter oraler Antikoagulation Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/patientinnen-die-fuer-einen-vorhofohrverschluss-in-frage-kommen, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 5.9 nennt „die Patient*innen, die für diese Prozedur in Frage kommen“ (S. 44, Z. 40): „diese Prozedur“ ist der Vorhofohrverschluss, den Box 5.8 bei „Patient*innen mit AF“ erwägt (S. 43, Z. 43). Im Geltungsbereich der Leitlinie gehört die Gruppe zu den Patient*innen mit Vorhofflimmern, deren Versorgung die Leitlinie laut ihrer Zielsetzung optimieren will (S. 10, Z. 55–57), ohne Bedingung. Die Eignung für eine Prozedur nennt kein Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/herzchirurgischer-eingriff, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 5.10 nennt „Patient*innen mit AF, die sich einem herzchirurgischen Eingriff unterziehen“ (S. 45, Z. 11–12), unter §5.4.3 „Vorhofohrverschluss: Herzchirurgische Patient*innen mit Vorhofflimmern“ (Z. 5). Im Geltungsbereich der Leitlinie ist der Eingriff einer ihrer Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), ohne Bedingung. Allgemein hat nicht jede*r mit herzchirurgischem Eingriff Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/af-induzierte-kardiomyopathie, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 6.3 nennt „Patient*innen mit AF -induzierter Kardiomyopathie“ (S. 51, Z. 59–60), unter §6.1.3 „Rhythmuskontrolle bei AF-induzierter Kardiomyopathie“ (Z. 33): ein Zustand, den die Empfehlung für Patient*innen mit AF nennt. Im Geltungsbereich der Leitlinie gehört die Gruppe zu den Patient*innen mit Vorhofflimmern, deren Versorgung die Leitlinie laut ihrer Zielsetzung optimieren will (S. 10, Z. 55–57); jedes Mitglied hat Vorhofflimmern, daher ohne Bedingung."}]
- [concepts/indikation-zu-einer-rhythmuskontrollierenden-behandlung, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 6.5 nennt Patient*innen „mit Indikation zu einer rhythmuskontrollierenden Behandlung“ (S. 53, Z. 53–55) und Vorhofflimmern im Ziel, „Zur Reduktion von AF-Episoden“ (Z. 52); sie steht unter §6.2 „Katheterablation bei Patient*innen mit dem Therapieziel der Rhythmuskontrolle“ (S. 53, Z. 20–21). Im Geltungsbereich der Leitlinie gehört die Gruppe zu den Patient*innen mit Vorhofflimmern, deren Versorgung die Leitlinie laut ihrer Zielsetzung optimieren will (S. 10, Z. 55–57), ohne Bedingung. Eine Indikation zur Rhythmuskontrolle nennt kein Vorhofflimmern, deshalb eine Geltungskante, kein broader."}]
- [concepts/strukturell-herzgesund, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 6.17 nennt „strukturell herzgesunden Patient*innen“ und Vorhofflimmern in der Maßnahme, „zur Konversion von gelegentlich auftretenden symptomatischen AF-Episoden“ (S. 66, Z. 23–25); Box 6.8 nennt „Patient*innen ohne strukturelle Herzerkrankung“ (S. 58, Z. 8) unter §6.5.1 „Medikamentöse Rhythmuskontrolle mit Klasse IC-Antiarrhythmika“, dessen Hintergrund sie „nur bei strukturell herzgesunden Patient*innen mit AF“ einsetzt (S. 57, Z. 51, 58). Im Geltungsbereich der Leitlinie sind strukturell Herzgesunde Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), ohne Bedingung. Allgemein ist nicht jede*r strukturell Herzgesunde an Vorhofflimmern erkrankt, deshalb eine Geltungskante, kein broader."}]
- [concepts/adipositas, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Box 8.7 nennt „Adipösen Menschen mit Vorhofflimmern“ (S. 89, Z. 40), unter §8.8 „Interventionelle Therapie von Vorhofflimmern bei Patient*innen mit Adipositas“ (Z. 6–7). Im Geltungsbereich der Leitlinie ist die Adipositas ein Zustand ihrer Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), ohne Bedingung, wie 8.7, die Empfehlung, deren Anker das Konzept ist, sie nennt. Allgemein hat nicht jede*r Adipöse Vorhofflimmern, deshalb eine Geltungskante, kein broader. Tabelle 6 (S. 25, Z. 32) und S. 89, Z. 10 nennen Adipositas als Risikofaktor für Vorhofflimmern, dort ohne bekanntes AF."}]
- [concepts/herzinsuffizienz, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Herzinsuffizienz ist die Familie der beiden Gruppen, die 6.4 und 7.4 ansprechen, und beide Boxen drucken Vorhofflimmern: 6.4 in der Maßnahme, „eine Katheterablation des AF“ (S. 52, Z. 38), unter §6.1.4 „Rhythmuskontrolle bei AF und Herzinsuffizienz“ (Z. 16); 7.4 in der Gruppe, „Patient*innen mit hochsymptomatischem permanenten AF und Herzinsuffizienz“ (S. 73, Z. 54–55). Im Geltungsbereich der Leitlinie ist die Herzinsuffizienz ein Zustand ihrer Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), ohne Bedingung: keine Empfehlung der Sicht spricht über sie Menschen ohne Vorhofflimmern an. Allgemein hat nicht jede*r mit Herzinsuffizienz Vorhofflimmern, deshalb eine Geltungskante, kein broader. Tabelle 6 (S. 25, Z. 17) nennt Herzinsuffizienz als Risikofaktor, bei dem ein EKG zur Erkennung von AF sinnvoll sein kann, dort ohne bekanntes AF."}]

# ── the groups the guideline takes into its scope without AF: the screened (3.1, 3.2), the smokers (4.6), kidney
# disease (the family of 5.6's group, and 8.3's condition), 5.7's group and the anticoagulated (8.1–8.3), each
# belonging to the target group only with AF (card #364, convention rows 6 and 12, reading 7; #314's answer 3).
# Each condition is flagged for the physician
- [concepts/menschen-im-alter-ab-75-jahren-und-oder-mit-erhoehtem-schlaganfallrisiko, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   condition: concepts/bei-vorhofflimmern,
   rationale: "Box 3.1 nennt Menschen „im Alter ≥75 Jahren und/oder“ „mit erhöhtem Schlaganfallrisiko“, bei denen ein EKG „bislang unerkanntes Vorhofflimmern“ erkennen soll (S. 24, Z. 38–41): ihr Vorhofflimmern ist nicht bekannt. Die Leitlinie nimmt sie mit Kapitel 3 „Screening von Vorhofflimmern“ (S. 24, Z. 5) in ihren Geltungsbereich, damit ihr Vorhofflimmern erkannt wird. Zur Zielgruppe der Leitlinie, den Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), gehören sie, sobald Vorhofflimmern vorliegt."}]
- [concepts/menschen-im-generellen-screening-auf-vorhofflimmern, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   condition: concepts/bei-vorhofflimmern,
   rationale: "Box 3.2 spricht von einem „generellen Screening auf Vorhofflimmern“ mit Geräten zum kontinuierlichen Monitoring (S. 26, Z. 14–15): die Gescreenten haben kein bekanntes Vorhofflimmern. Die Leitlinie nimmt sie zur Früherkennung in ihren Geltungsbereich (Kapitel 3 „Screening von Vorhofflimmern“, S. 24, Z. 5; S. 28, Z. 15–16: „Interventionen zur Früherkennung von AF werden im Kapitel 3 Screening von Vorhofflimmern behandelt“). Zur Zielgruppe der Leitlinie, den Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), gehören sie, sobald Vorhofflimmern vorliegt."}]
- [concepts/patientinnen-mit-af-sowie-alle-patientinnen-die-regelmaessig-zigaretten-rauchen, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   condition: concepts/bei-vorhofflimmern,
   rationale: "Box 4.6 nennt „Patient*innen mit AF sowie allen Patient*innen, die regelmäßig Zigaretten rauchen“ (S. 33, Z. 38–39): auch Rauchende ohne Vorhofflimmern. Die Leitlinie nimmt sie zur Primärprävention in ihren Geltungsbereich (Zielsetzung, S. 11, Z. 11: „durch evidenzbasierte Maßnahmen der Primärprävention die Inzidenz von AF zu senken“; §4.1, S. 28, Z. 11: Primärprävention als Verhinderung von „de-novo“ AF). Zur Zielgruppe der Leitlinie, den Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), gehören sie bei Vorhofflimmern; wer AF hat, erfüllt die Bedingung schon."}]
- [concepts/nierenerkrankung, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   condition: concepts/bei-vorhofflimmern,
   rationale: "Box 8.3 nennt „Patient*innen mit Nierenerkrankung unter oraler Antikoagulation“ (S. 83, Z. 10), Box 5.6 „Patient*innen mit chronischer Nierenerkrankung“ (S. 42, Z. 44), eine Nierenerkrankung; keine der beiden nennt Vorhofflimmern, weder in der Gruppe noch in der Maßnahme. 5.6 steht im Kapitel 5 „Schlaganfallprävention“, das von Patient*innen mit AF spricht (S. 37, Z. 39–44), 8.3 unter §8.2 „Direkte orale Antikoagulanzien“ (S. 81, Z. 20). Allgemein hat nicht jede*r mit Nierenerkrankung Vorhofflimmern. Zur Zielgruppe der Leitlinie, den Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), gehören sie bei Vorhofflimmern; liest man Kapitel 5 als für 5.6 mitgesagt, gilt die Bedingung dort für jedes Mitglied schon."}]
- [concepts/patientinnen-mit-nierenversagen-und-dialysepatientinnen, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   condition: concepts/bei-vorhofflimmern,
   rationale: "Box 5.7 nennt „Patient*innen mit Nierenversagen und Dialysepatient*innen“ (S. 42, Z. 49) und Vorhofflimmern weder in der Gruppe noch in der Maßnahme, der Entscheidung über „die Form der Prävention thromboembolischer Ereignisse“ (Z. 49–51); sie steht unter §5.3.3 „Chronische Nierenerkrankung“ (Z. 39) im Kapitel 5 „Schlaganfallprävention“, das von Patient*innen mit AF spricht (S. 37, Z. 39–44). Allgemein hat nicht jede*r mit Nierenversagen oder Dialyse Vorhofflimmern. Zur Zielgruppe der Leitlinie, den Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), gehören sie bei Vorhofflimmern; liest man Kapitel 5 als für die Box mitgesagt, gilt die Bedingung für jedes Mitglied schon."}]
- [concepts/patientinnen-unter-oraler-antikoagulation, in_scope_of, concepts/patientinnen-mit-vorhofflimmern, {source: modelling, as_of: "2026-10-12", lang: de,
   condition: concepts/bei-vorhofflimmern,
   rationale: "Die Boxen 8.1 und 8.2 nennen „Patient*innen unter oraler Antikoagulation“ (S. 79, Z. 30; S. 82, Z. 12), Box 8.3 „Patient*innen mit Nierenerkrankung unter oraler Antikoagulation“ (S. 83, Z. 10); keine nennt Vorhofflimmern. 8.1 steht unter §8.1 „OAK-Management bei geplanten Operationen“ (S. 78, Z. 40), 8.2 und 8.3 unter §8.2 „Direkte orale Antikoagulanzien“ (S. 81, Z. 20). Abbildung 6, nach der 8.1 vorgeht, nennt im Titel das „Management der oralen Antikoagulationstherapie bei Patient*innen mit Vorhofflimmern“ (S. 81, Z. 6–7), ihre Fußnote a Vorhofflimmern als einen Risikofaktor neben einem mechanischen Aortenklappenersatz (Z. 9). Zur Zielgruppe der Leitlinie, den Patient*innen mit Vorhofflimmern (Zielsetzung, S. 10, Z. 55–57), gehören die Patient*innen unter oraler Antikoagulation bei Vorhofflimmern; als antikoagulierte Patient*innen mit AF gelesen, gilt die Bedingung für jedes Mitglied schon."}]
