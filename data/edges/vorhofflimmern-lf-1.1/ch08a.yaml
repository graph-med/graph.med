# disagreement (spec §5, §5.1 D; #341; #379): each printing kept as printed and shown, none chosen. Footnotes of Abb. 6
# and 7 that print, in the text layer, a rule the body text prints otherwise are claims of their own (#379); what an
# image prints otherwise is shown by its caption's claim, the rationale saying what the image shows, read off it and
# not quoted (spec §5; card #382 reading 9). Nothing equates „≥7“ and „> 6“.
- [claims/vorhofflimmern-lf-1.1/8e1aa18c, disagrees_with, claims/vorhofflimmern-lf-1.1/228b52eb, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Fußnote c der Abbildung 7 (S. 82, Z. 34–38): „aufgrund des erhöhten Blutungsrisikos wird ein Bridging in den meisten Fällen nicht empfohlen. Zu den wenigen Ausnahmen werden Patient*innen mit einem sehr hohen thromboembolischen Risiko mit CHA2DS2-VA-Score ≥7, Z. n. Schlaganfall oder TIA <3 Monate, Z. n. thromboembolischem Ereignis bei perioperativer/periinterventioneller DOAK-Pause, rheumatische Herzklappenerkrankungen, Z. n. mechanischem Herzklappenersatz.“ Der Text (S. 85, Z. 11–16) nennt die Hochrisikokonstellationen, in denen ein Bridging nach präoperativem Absetzen der VKA diskutiert werden kann: ein „kürzlich (≤ 3 Monate) eingetretenen thromboembolischen Ereignis“, ein Ereignis „während einer vorangegangenen adäquaten Unterbrechung der OAK-Therapie“ oder „einem sehr hohen allgemeines Thromboserisiko CHA2DS2-VA > 6“. Die Grenze des Scores steht zweimal anders, „≥7“ und „> 6“, die Frist als „<3 Monate“ und „≤ 3 Monate“; Herzklappenerkrankungen und den mechanischen Herzklappenersatz nennt nur die Fußnote. Keine Fassung ist gewählt, keine Grenze der anderen gleichgesetzt."}]
- [claims/vorhofflimmern-lf-1.1/9a9e16ca, disagrees_with, claims/vorhofflimmern-lf-1.1/8e1aa18c, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Abbildung 6 (S. 81) zeichnet bei hohem Blutungs- und hohem thromboembolischem Risiko einen Zweig für den mechanischen Klappenersatz mit Bridging (vom Bild abgelesen, nicht zitiert): Mechanischer Klappenersatz mit der Marke a, VKA, Bridging mit der Marke c. Ihre Fußnote a (S. 81, Z. 9–11) fasst ihn enger: „Mechanischer Aortenklappenersatz plus min. 1 Risikofaktor (AF, hochgradige LV-Dysfunktion, hyperkoagulabler Zustand)“. Fußnote c der Abbildung 7 (S. 82, Z. 35–38) zählt zu den Ausnahmen vom Verzicht auf ein Bridging „Z. n. mechanischem Herzklappenersatz“, jede Herzklappe und ohne Risikofaktor. Eine Unterscheidung, die die eine Fußnote zieht und die andere nicht. Keine Fassung ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/9a9e16ca, disagrees_with, claims/vorhofflimmern-lf-1.1/ad8bb085, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Fußnote a der Abbildung 6 (S. 81, Z. 9–11) fasst einen Zweig, den das Bild bei hohem Blutungs- und hohem thromboembolischem Risiko mit Bridging zeichnet (vom Bild abgelesen, nicht zitiert): Mechanischer Klappenersatz mit der Marke a, Bridging. Die Fußnote fasst ihn als „Mechanischer Aortenklappenersatz plus min. 1 Risikofaktor (AF, hochgradige LV-Dysfunktion, hyperkoagulabler Zustand)“. Der Text (S. 85, Z. 26–27): „Bei Patient*innen mit mechanischem Herzklappenersatz ist ein Bridging mit niedermolekularem Heparin prinzipiell möglich“, für jede mechanische Herzklappe und ohne Risikofaktor. Eine Unterscheidung, die die Fußnote zieht und der Text nicht. Keine Fassung ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/6422f312, disagrees_with, claims/vorhofflimmern-lf-1.1/228b52eb, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Fußnote b der Abbildung 6 (S. 81, Z. 11–12) nennt die Fälle der Patient*innen mit einem sehr hohen thromboembolischen Risiko, für die das Bild bei hohem Blutungsrisiko ein Bridging zeichnet (vom Bild abgelesen, nicht zitiert): Ausgewählte Patienten mit einem sehr hohen thromboembolischen Risiko, ggf. Bridging. Die Fußnote: „Z. n. Schlaganfall oder TIA < 3 Monate, Z. n. thromboembolischen Ereignis bei perioperativer/periinterventioneller DOAK-Pause, rheumatische Herzklappenerkrankung“. Der Text (S. 85, Z. 11–16) nennt ein „kürzlich (≤ 3 Monate) eingetretenen thromboembolischen Ereignis (einschließlich Schlaganfall, systemischer Embolie oder venöser Thrombose/Lungenembolie)“, ein Ereignis „während einer vorangegangenen adäquaten Unterbrechung der OAK-Therapie“ oder „einem sehr hohen allgemeines Thromboserisiko CHA2DS2-VA > 6“. Die Frist steht als „< 3 Monate“ und „≤ 3 Monate“; die Fußnote nennt Schlaganfall oder TIA, der Text jedes thromboembolische Ereignis; die rheumatische Herzklappenerkrankung nennt nur die Fußnote, den Score nur der Text. Keine Fassung ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/6422f312, disagrees_with, claims/vorhofflimmern-lf-1.1/8e1aa18c, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Die Fußnoten zweier Abbildungen nennen die Ausnahmen mit sehr hohem thromboembolischem Risiko verschieden: Fußnote b der Abbildung 6 (S. 81, Z. 11–12) „Z. n. Schlaganfall oder TIA < 3 Monate, Z. n. thromboembolischen Ereignis bei perioperativer/periinterventioneller DOAK-Pause, rheumatische Herzklappenerkrankung“; Fußnote c der Abbildung 7 (S. 82, Z. 35–38) dieselben drei, die Frist als „<3 Monate“, und dazu „CHA2DS2-VA-Score ≥7“ und „Z. n. mechanischem Herzklappenersatz“. Den Score nennt Fußnote b nicht. Keine Fassung ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/5668cd5f, disagrees_with, claims/vorhofflimmern-lf-1.1/ad8bb085, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Abbildung 6 (S. 81) zeichnet zwei Bridgings mit zwei Fußnoten (vom Bild abgelesen, nicht zitiert): Mechanischer Klappenersatz, VKA, Bridging mit der Marke c; Ausgewählte Patienten mit einem sehr hohen thromboembolischen Risiko, VKA/DOAK, ggf. Bridging mit der Marke d. Die Fußnoten: „c= Behandlung mit unfraktioniertem Heparin“ und „d= Behandlung mit unfraktioniertem Heparin oder niedermolekularem Heparin“. Der Text (S. 85, Z. 26–27): „Bei Patient*innen mit mechanischem Herzklappenersatz ist ein Bridging mit niedermolekularem Heparin prinzipiell möglich“. Für den Klappenersatz nennt die Abbildung das unfraktionierte Heparin allein, der Text auch das niedermolekulare: eine Unterscheidung, die die Abbildung zieht und der Text nicht. Keine Fassung ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/412963c7, disagrees_with, claims/vorhofflimmern-lf-1.1/2a101352, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Abbildung 7 (S. 82), ein Bild ohne Textebene, dessen Seite ihre Bildunterschrift ist, zeigt für Phenprocoumon den Neubeginn nach dem Eingriff je nach Blutungsrisiko (vom Bild abgelesen, nicht zitiert): bei moderatem Blutungsrisiko Start Phenprocoumon nach ≥ 12–24 h, bei hohem Start Phenprocoumon nach ≥ 24 h. Der Text (S. 84, Z. 49–50): „kann die Einnahme oft 12-24 Stunden nach dem Eingriff wieder begonnen werden“, ohne nach dem Blutungsrisiko zu unterscheiden. Bei hohem Blutungsrisiko nennt das Bild mindestens 24 Stunden, der Text oft 12–24 Stunden. Keine Fassung ist gewählt."}]
