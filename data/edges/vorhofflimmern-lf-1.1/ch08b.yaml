# disagreement (spec §5, §5.1 D; #341): each printing kept as printed and shown, none chosen; a side the image prints is
# its caption's claim, and the words read off the image are marked as not quoted (spec §5; the judge, 2026-10-12)
- [claims/vorhofflimmern-lf-1.1/0a64471a, disagrees_with, claims/vorhofflimmern-lf-1.1/f5ea6395, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Empfehlung 8.6 (S. 89) nennt bei stark adipösen Menschen die „Zunahme prozeduraler Risiken“ der Ablation; ihre Begründung (S. 89, Z. 57–58): „Die Vorhofflimmerablation selbst ist bei adipösen Patient*innen mit höherer Strahlenbelastung, nicht aber höheren Komplikationsraten assoziiert.“ Der Kasten nennt die prozeduralen Risiken steigend, der Text die Komplikationsraten nicht höher; der folgende Satz nennt das erschwerte Management von Komplikationen. Keine Angabe ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/12181255, disagrees_with, claims/vorhofflimmern-lf-1.1/b7a2bf7f, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Empfehlung 8.5 (S. 87) lässt die Indikation zur Antikoagulation bei postoperativ neu aufgetretenem Vorhofflimmern „gemäß den Empfehlungen 5.3 und 5.4“ prüfen. Abbildung 9 (S. 88), „Prävention und Behandlung von perioperativem Vorhofflimmern (POAF)“, ist ein Bild ohne Textebene; ihre letzte Zeile zeigt (vom Bild abgelesen, nicht zitiert): Postoperative Maßnahmen nach perioperativ aufgetretenem Vorhofflimmern (POAF) – Management der Langzeit-Antikoagulation – Siehe Empfehlungen 6.3 und 6.4. Kasten und Abbildung nennen für dieselbe Antikoagulation zwei verschiedene Empfehlungspaare; keines ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/de009d64, disagrees_with, claims/vorhofflimmern-lf-1.1/b7a2bf7f, {source: modelling, as_of: "2026-10-11", lang: de,
   rationale: "Der Text (S. 87, Z. 21–22): „Amiodaron wird aufgrund des Nebenwirkungsprofil nicht routinemäßig vor Eingriffen empfohlen, nur ggf. bei Patient*innen mit einem hohen Risiko für AF.“ Abbildung 9 (S. 88), „Prävention und Behandlung von perioperativem Vorhofflimmern (POAF)“, ist ein Bild ohne Textebene; ihre Zeile zur Prävention rät (vom Bild abgelesen, nicht zitiert): Betablocker oder Amiodaron prophylaktisch bei Herz-/Thoraxchirurgischen Operationen erwägen. Für dieselbe Prophylaxe mit Amiodaron nennt der Text die Gruppe nach dem Risiko für AF, die Abbildung nach der Art der Operation; keine Angabe ist gewählt."}]
- [claims/vorhofflimmern-lf-1.1/dd6d3a88, disagrees_with, claims/vorhofflimmern-lf-1.1/b7a2bf7f, {source: modelling, as_of: "2026-10-12", lang: de,
   rationale: "Der Text (S. 87, Z. 15–16) empfiehlt, „keine Betablockertherapie vor nicht-herzchirurgischen Eingriffen zu beginnen“. Abbildung 9 (S. 88), „Prävention und Behandlung von perioperativem Vorhofflimmern (POAF)“, ist ein Bild ohne Textebene; ihre Zeile zur Prävention rät (vom Bild abgelesen, nicht zitiert): Betablocker oder Amiodaron prophylaktisch bei Herz-/Thoraxchirurgischen Operationen erwägen. Für thoraxchirurgische Eingriffe, die nach dem Wortlaut des Textes nicht herzchirurgisch sind, rät der Text vom Beginn eines Betablockers ab, die Abbildung zu seiner Erwägung; keine Angabe ist gewählt. Fußnote 1 der Abbildung (S. 88, Textebene) stellt „gute Evidenz für Herz und Thoraxchirurgie“ gegen „bei nicht herzchirurgischen Eingriffen schwache Evidenz“ und zählt Thoraxeingriffe so zur Herzchirurgie: ob sich die Gruppen überschneiden, bestätigt die ärztliche Durchsicht."}]
