# ausreichende-volumengabe] stays as it is (§5.1 N3). No edge 8.1 → 4.6: Bemerkung 2 measures the need by
# noradrenaline alone. The volume of 2.5 and 2.8 (chapter 2) lies outside card #296's pages, named in its pull request.
- [statements/hydrokortison-bei-septischem-schock-mit-anhaltendem-vasopressorbedarf, follows, statements/noradrenalin-vasopressor-erster-wahl, {source: modelling, as_of: "2026-10-22", lang: de, transition: adds, trigger: target_missed,
