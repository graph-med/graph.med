# Edges between statements or concepts of two chapters of sources/sepsis-lf-4.0 (card #227), all modelling: what a
# chapter part could not see, asserted once after all of them (card #210, Decision 6). Two kinds:
#   - cross-statement semantics (spec §5), statement → statement, each rationale naming both boxes;
#   - subsumption (spec §5 `broader`), the families across chapters of concepts that fill no population or condition
#     slot of a statement in views/sepsis-lf-4.0 (those that do are card #228's, in broader-edges.yaml).
# No `broader` edge runs from a concept the first source also uses (open question scope-edge-pinning); one into
# concepts/mortalitaet, which both sources use, is allowed (card #217). Nothing is inherited along `broader`.

# cross-statement semantics (spec §5): statement → statement, across chapters
# 2.5 and 4.1: the physician's open question on card #227, specializes or complements. The reading taken is
# complements: 4.1's population and its fluid therapy are wider than 2.5's, and 2.5 names no solution, so neither
# is a special case of the other.
- [statements/balancierte-kristalloide-erste-wahl-sepsis, complements, statements/initiale-kristalloide-loesung-30-ml-kg, {source: modelling, as_of: "2026-09-25", lang: de,
   rationale: "Empfehlungen 2.5 und 4.1: 2.5 sagt, wie viel kristalloide Lösung in den ersten 3 Stunden gegeben wird („als Richtwert 30 mL/kg“), 4.1, welche („balancierte Kristalloide als Flüssigkeitstherapie der ersten Wahl“); S. 57 spricht die Empfehlung für kristalloide Lösungen „im Rahmen der initialen Flüssigkeitstherapie“ aus und fragt dann, „welche kristalloide Lösung“ besser geeignet ist. Keine ersetzt die andere."}]
- [statements/noradrenalin-vasopressor-erster-wahl, complements, statements/vasopressoren-periphervenoes, {source: modelling, as_of: "2026-09-25", lang: de,
   rationale: "Empfehlungen 2.7 und 4.5: 2.7 sagt, auf welchem Weg Vasopressoren gegeben werden (auch periphervenös, ohne auf einen ZVK zu warten), 4.5, welcher Vasopressor der erste ist (Noradrenalin); S. 32: „Noradrenalin kann in dieser Notfallsituation auch über einen periphervenösen Zugang appliziert werden.“ Keine ersetzt die andere."}]
- [statements/vasopressin-ergaenzen-septischer-schock, complements, statements/map-zielwert-65-mmhg, {source: modelling, as_of: "2026-09-25", lang: de,
