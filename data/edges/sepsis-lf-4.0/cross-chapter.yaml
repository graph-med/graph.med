# sequences (spec §5 `follows`; #294, #295; card #296): 8.1 after 4.5 and 4.1, by the four tests of spec §5 — the
# noradrenaline of Bemerkung 2 measures the response to 4.5's measure (test 4), and „trotz ausreichender Volumengabe“
