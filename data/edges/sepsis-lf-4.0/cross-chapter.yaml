   rationale: "Empfehlungen 4.1 und 8.1: 8.1 (S. 105) schlägt Hydrokortison bei septischem Schock mit anhaltendem Vasopressorbedarf „trotz ausreichender Volumengabe“ vor — trotz der Flüssigkeitstherapie, für die 4.1 im Abschnitt „4.1 Flüssigkeitstherapie“ (S. 57) balancierte Kristalloide als erste Wahl empfiehlt. Die Volumengabe hat den Vasopressorbedarf nicht beendet; Hydrokortison tritt hinzu. Der Hintergrund berichtet dieselbe Folge aus der S3-Leitlinie 2018, Hydrokortison „für den Fall …, dass eine adäquate Flüssigkeits- und hochdosierte Vasopressor-Therapie nicht in der Lage sind, eine hämodynamische Stabilität wiederherzustellen“ (S. 105, Z. 36–38). Die Volumengabe geben auch die Empfehlungen 2.5 und 2.8 (Kapitel 2); welchen Kasten sie meint, sagt die Seite nicht."}]

