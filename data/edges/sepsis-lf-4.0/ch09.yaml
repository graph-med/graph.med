   rationale: "R: „informiert werden“ — wann und durch wen: im Entlassmanagement, das Krankenhäuser nach § 39 Absatz 1a SGB V zu gewährleisten haben; „Dazu gehört auch der Verweis auf die Teilnahme in Selbsthilfe-Gruppen“."}]
