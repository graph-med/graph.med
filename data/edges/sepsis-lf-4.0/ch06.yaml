# defined_by (spec §3.2, §5): one edge per derived concept, to the claim at the top of its rule
- [concepts/lebensbedrohliche-veraenderungen-fluessigkeits-saeure-basen-elektrolythaushalt, defined_by, claims/sepsis-lf-4.0/ed376099, {source: modelling, as_of: "2026-09-25", lang: de,
   rationale: "„lebensbedrohlichen Veränderungen des Flüssigkeits-, Säure-Basen- oder Elektrolythaushaltes“ — „In der Tabelle werden lebensbedrohliche Veränderungen als absolute Indikationen für eine Nierenersatztherapie (NET) aufgeführt“: die Tabelle, deren vier Zeilen die Fälle nennen; wie sie sich verbinden, sagt die Seite nicht (not_stated). Die Zeile Urämie gehört zu keiner der drei Kategorien, die der Begriff nennt."}]
- [concepts/kontinuierliche-hochvolumige-haemofiltration, defined_by, claims/sepsis-lf-4.0/863077be, {source: modelling, as_of: "2026-09-25", lang: de,
