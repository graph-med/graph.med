# between the chapter's statements (spec §5.1 N1: what one box says of another)
- - statements/albumin-additiv-bei-grossem-fluessigkeitsbedarf
  - complements
  - statements/balancierte-kristalloide-erste-wahl-sepsis
  - source: modelling
    rationale: "Albumin wird „additiv zu balancierten Kristalloiden“ verabreicht (4.2): es tritt zur Flüssigkeitstherapie der ersten Wahl (4.1) hinzu und ersetzt sie nicht; die Population ist dieselbe, der Bedarf großer Flüssigkeitsmengen die Bedingung."
    lang: de
    as_of: "2026-09-25"
- - statements/vasopressin-ergaenzen-septischer-schock
  - complements
  - statements/noradrenalin-vasopressor-erster-wahl
  - source: modelling
    rationale: "Vasopressin wird „ergänzt“, „wenn mit Noradrenalin alleine kein ausreichender Blutdruck erzielt werden kann“ (4.6): es tritt zu Noradrenalin, dem Vasopressor erster Wahl (4.5), hinzu und ersetzt es nicht."
    lang: de
    as_of: "2026-09-25"
