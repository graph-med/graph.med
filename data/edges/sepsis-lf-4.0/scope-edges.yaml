# scope edges (spec §5 `in_scope_of`): "counts, within the scope of this guideline, as a case of" — what the
# guideline stipulates for its own scope and `broader` cannot hold, because it is not true whatever guideline
# one reads. All modelling with a rationale; `condition` names the circumstance under which the membership
# holds, its absence means unconditional. They form the scope tree of views/sepsis-lf-4.0, which ends in its
# scope_root, the guideline's patient target group (1.3, p. 20; 1.1, p. 19: adults, >18 Jahre). Card #228.
#
# Every edge into the root is a scope edge, never broader: the root's patients are adults, and that holds only
# inside the guideline (card #217). No scope edge runs from a concept the first source uses.

# ── the groups whose patients all have a sepsis or a septic shock, unconditionally: Sepsis and septischer Schock,
# the one group printed as an alternative of them (2.5), and the X of "Patienten mit Sepsis oder septischem Schock
# und X" (card #217, convention row 6, the maintainer's answer to its question 2)
- [concepts/sepsis, in_scope_of, concepts/erwachsene-mit-sepsis-oder-septischem-schock, {source: modelling, as_of: "2026-09-25", lang: de,
   rationale: "Im Geltungsbereich der Leitlinie sind Patienten mit Sepsis erwachsene Patienten mit Sepsis oder septischem Schock, ihre Patient*innenzielgruppe (1.3, S. 20; 1.1: >18 Jahre, S. 19). Allgemein ist nicht jeder Patient mit Sepsis erwachsen; deshalb eine Geltungskante, kein broader."}]
- [concepts/septischer-schock, in_scope_of, concepts/erwachsene-mit-sepsis-oder-septischem-schock, {source: modelling, as_of: "2026-09-25", lang: de,
