# "Prävention der Sepsis"; 1.2, p. 20: "Früherkennung"), and each belongs to the target group only when a sepsis
# or a septic shock is present (card #217, question 5; the prevention group by the maintainer's decision of
# 2026-09-25). Each condition is flagged for the physician
- [concepts/verdacht-auf-eine-infektion, in_scope_of, concepts/erwachsene-mit-sepsis-oder-septischem-schock, {source: modelling, as_of: "2026-09-25", lang: de,
